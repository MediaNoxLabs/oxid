name: Factory work item
description: A bounded, machine-executable slice of work for the AI Software Factory (docs/factory).
title: "[factory] "
labels: []
body:
  - type: input
    id: goal
    attributes:
      label: Goal
      description: One sentence. What exists when this item is done that does not exist now?
      placeholder: Expose resumable X through a Y boundary without Z.
    validations:
      required: true
  - type: textarea
    id: ac_dod_matrix
    attributes:
      label: AC / DoD matrix
      description: Map every stable criterion and its concrete outcome to completion evidence. The first cell must include both the ID and criterion, not only `AC-1`.
      placeholder: |
        | Acceptance criterion | Completion evidence |
        | --- | --- |
        | AC-1: incomplete issues stop before worktree creation | focused negative contract test proves no worktree call |
        | AC-2: complete issues enter the selected worktree | positive bootstrap fixture and exact path assertion |
    validations:
      required: true
  - type: textarea
    id: implementation_surface
    attributes:
      label: Implementation surface
      description: Exact files or modules expected to change; this is the admission boundary.
      placeholder: |
        - scripts/lib/example.mjs
        - tests/repository/example.test.mjs
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: Explicitly out of scope
      description: What this slice deliberately does not do (prevents scope creep and bulk copies).
      placeholder: |
        - ...
    validations:
      required: true
  - type: input
    id: delivery_target
    attributes:
      label: Delivery target
      description: Exact existing milestone-x.y.z branch for product work, or develop for eligible factory/harness/CI/docs/dependency/governance work. Never write latest or current.
      placeholder: milestone-0.4.0
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification commands
      description: Commands that must pass, runnable from a clean checkout (just/run.sh targets preferred).
      placeholder: |
        ./run.sh --light --strict
        cargo test -p <crate>
    validations:
      required: true
  - type: dropdown
    id: size
    attributes:
      label: Size class
      description: "S: ≤1 crate touched. M: ≤3 crates, no new ADR. L: new ADR or new crate (link the ADR draft)."
      options:
        - S
        - M
        - L
    validations:
      required: true
  - type: textarea
    id: capabilities
    attributes:
      label: Required worker capabilities
      description: Host capabilities a worker needs (nix devshell, iOS simulator, Android emulator, network fixtures). Leave empty if plain cargo suffices.
      placeholder: |
        - nix develop
  - type: textarea
    id: context
    attributes:
      label: Context and constraints
      description: ADRs that bind this work, related issues, migration provenance, and anything AGENT.md says that is easy to violate here.
