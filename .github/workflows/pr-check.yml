name: Check PR

on:
  # Keep title/body validation on the unprivileged PR-head event so required
  # contexts attach to the reviewed commit. Cross-base enforcement is owned by
  # the repository ruleset, not by this workflow.
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-pr-title:
    name: Validate PR title
    runs-on: ubuntu-24.04
    # Dependabot and Renovate generate their own title and body from
    # repository configuration and cannot be taught this repository's
    # conventional-commit scopes or body template, so these gates can never
    # pass on their branches. Leaving them red on every dependency pull
    # request trains reviewers to ignore red checks, which is the opposite of
    # what an all-green merge culture needs.
    if: >-
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.user.login != 'renovate[bot]'
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            chore
            ci
            build
            revert
          scopes: |
            wallet
            platform
            adapter
            ui
            composition
            architecture
            deps
            docs
            config
            harness
            ci
          requireScope: false
          subjectPattern: ^(?=.*\S).+$
          subjectPatternError: The pull request subject must not be empty.
          wip: true

  validate-pr-body:
    name: Validate PR body
    runs-on: ubuntu-24.04
    # Dependabot and Renovate generate their own title and body from
    # repository configuration and cannot be taught this repository's
    # conventional-commit scopes or body template, so these gates can never
    # pass on their branches. Leaving them red on every dependency pull
    # request trains reviewers to ignore red checks, which is the opposite of
    # what an all-green merge culture needs.
    if: >-
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.user.login != 'renovate[bot]'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const body = (context.payload.pull_request.body || '').trim();
            if (!body) {
              core.setFailed('PR body is empty. Describe the change and validation.');
            }
