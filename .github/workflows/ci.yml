name: CI

on:
  push:
    branches: [integration, develop, main]
  pull_request:
    branches: [integration, develop, main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: oxid-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Repository gate (fmt, architecture, lint, tests, coverage)
    runs-on: ubuntu-24.04
    # The gate compiles and tests the workspace inside the devshell. Warm
    # caches finish well under 20 minutes; the bound covers cold-cache runs.
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed paths
        id: risk
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          tier="$(node scripts/ci/change-tier.mjs --base "$BASE_SHA" --head "$HEAD_SHA")"
          printf 'tier=%s\n' "$tier" >> "$GITHUB_OUTPUT"
          printf 'Selected CI tier: %s\n' "$tier"

      - name: Install Nix
        if: steps.risk.outputs.tier == 'rust' || steps.risk.outputs.tier == 'full'
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Cache the devshell Nix store
        if: steps.risk.outputs.tier == 'rust' || steps.risk.outputs.tier == 'full'
        uses: nix-community/cache-nix-action@135667ec418502fa5a3598af6fb9eb733888ce6a # v6.1.3
        with:
          primary-key: nix-devshell-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix', 'nix/**/*.nix') }}
          restore-prefixes-first-match: nix-devshell-${{ runner.os }}-
          gc-max-store-size-linux: 6G
          purge: true
          purge-prefixes: nix-devshell-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never

      - name: Cache cargo registry
        if: steps.risk.outputs.tier == 'rust' || steps.risk.outputs.tier == 'full'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      - name: Run documentation smoke gate
        if: steps.risk.outputs.tier == 'docs'
        run: node --test tests/repository/change-tier-contract.test.mjs

      - name: Run hermetic repository harness gate
        if: steps.risk.outputs.tier == 'harness'
        run: ./run.sh repository --strict

      - name: Run Rust gate
        if: steps.risk.outputs.tier == 'rust'
        run: nix develop --command ./run.sh core --strict

      - name: Run full repository gate
        if: steps.risk.outputs.tier == 'full'
        run: nix develop --command ./run.sh --light --strict

  nix-build:
    name: Locked Nix package and Compact artifacts
    runs-on: ubuntu-24.04
    # The per-push package build proves the locked package and Compact
    # artifacts still build; its sandboxed test re-run (doCheck) moved to the
    # checked variants exercised by the nightly `nix flake check` workflow,
    # because the repository gate already executes every test on each push.
    # This job runs in parallel with the gate, so the workflow's wall time is
    # the slower of the two rather than their sum. Cold caches have reached
    # ~40 minutes; keep bounded headroom for download throttling.
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed paths
        id: risk
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          tier="$(node scripts/ci/change-tier.mjs --base "$BASE_SHA" --head "$HEAD_SHA")"
          printf 'tier=%s\n' "$tier" >> "$GITHUB_OUTPUT"
          printf 'Selected CI tier: %s\n' "$tier"

      - name: Install Nix
        if: steps.risk.outputs.tier == 'full'
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Cache the package-build Nix store
        if: steps.risk.outputs.tier == 'full'
        uses: nix-community/cache-nix-action@135667ec418502fa5a3598af6fb9eb733888ce6a # v6.1.3
        with:
          primary-key: nix-build-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix', 'nix/**/*.nix', 'Cargo.lock') }}
          restore-prefixes-first-match: nix-build-${{ runner.os }}-
          gc-max-store-size-linux: 6G
          purge: true
          purge-prefixes: nix-build-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never

      - name: Build the locked Nix package
        if: steps.risk.outputs.tier == 'full'
        run: nix build --print-build-logs

      - name: Build Digital Passport presentation artifacts
        if: steps.risk.outputs.tier == 'full'
        run: nix build .#presentation-compact-artifacts --print-build-logs

      - name: Record skipped package build
        if: steps.risk.outputs.tier != 'full'
        run: printf 'Locked package build is not required for the %s tier.\n' '${{ steps.risk.outputs.tier }}'
