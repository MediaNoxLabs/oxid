name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: oxid-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-lint-test:
    name: Build, Lint, Test, and Architecture
    runs-on: ubuntu-24.04
    # A cold locked Nix package build plus its check phase has reached 59
    # minutes on GitHub-hosted runners. Keep bounded headroom for transient
    # action/download throttling without weakening any gate.
    timeout-minutes: 75
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Run repository gate
        run: nix develop --command ./run.sh --light --strict

      - name: Build the locked Nix package
        run: nix build --print-build-logs

      - name: Build Digital Passport presentation artifacts
        run: nix build .#presentation-compact-artifacts --print-build-logs
