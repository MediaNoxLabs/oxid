name: Check PR delivery base

on:
  # zizmor: ignore[dangerous-triggers] This metadata-only workflow has no
  # checkout, shell, event expressions, or PR-controlled action inputs. The
  # repository contract test rejects any future introduction of those paths.
  pull_request_target:
    # Runs the protected default-branch workflow definition, never PR-head code.
    types: [opened, edited, synchronize, reopened]

permissions:
  # Read only the PR and its closing-issue metadata; no repository contents,
  # secrets, or write permission are available to this workflow.
  pull-requests: read
  issues: read

jobs:
  require-integration-base:
    name: Require integration for issue-backed PRs
    runs-on: ubuntu-24.04
    steps:
      - name: Validate delivery base
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // PR_BASE_CONTRACT_START
            const pullRequest = context.payload.pull_request;
            if (!pullRequest) {
              core.setFailed("The integration-base contract requires pull request metadata.");
              return;
            }
            const body = (pullRequest.body || "")
              .replace(/<!--[\s\S]*?-->/g, "")
              .replace(/```[\s\S]*?```/g, "")
              .replace(/~~~[\s\S]*?~~~/g, "")
              .replace(/`[^`\n]+`/g, "")
              .replace(/^(?:>| {4}|\t).*$/gm, "");
            // Accept GitHub's bare local form plus exact local qualified forms.
            // A delimiter lookahead prevents local-looking prefixes and issue
            // numbers with trailing path or name content from matching.
            const closesInBody = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)(?:\s*:\s*|\s+)(?:https:\/\/github\.com\/MediaNoxLabs\/oxid\/issues\/\d+|MediaNoxLabs\/oxid#\d+|#\d+)(?=$|[\s,.;:!?)}\]'"])/i.test(body);
            let linkedLocalIssueCount;
            try {
              const result = await github.graphql(`
                query($owner: String!, $repo: String!, $number: Int!) {
                  repository(owner: $owner, name: $repo) {
                    pullRequest(number: $number) {
                      closingIssuesReferences(first: 100) {
                        nodes { repository { nameWithOwner } }
                      }
                    }
                  }
                }
              `, { ...context.repo, number: context.payload.number });
              const localRepository = `${context.repo.owner}/${context.repo.repo}`.toLowerCase();
              linkedLocalIssueCount = result.repository.pullRequest.closingIssuesReferences.nodes
                .filter((issue) => issue.repository.nameWithOwner.toLowerCase() === localRepository)
                .length;
            } catch (error) {
              core.setFailed(`Could not resolve closing-issue metadata: ${error.message}`);
              return;
            }
            const issueBacked = closesInBody || linkedLocalIssueCount > 0;
            const baseRef = pullRequest.base.ref;
            const headRef = pullRequest.head.ref;
            if (issueBacked && baseRef !== "integration") {
              core.setFailed(`Issue-backed pull requests must target integration; received ${headRef} -> ${baseRef}. No release-promotion exception is active.`);
            } else {
              core.info(`Delivery base accepted: ${headRef} -> ${baseRef}.`);
            }
            // PR_BASE_CONTRACT_END
