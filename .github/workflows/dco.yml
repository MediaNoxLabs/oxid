name: DCO

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  signoff:
    name: Verify commit sign-offs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Dependabot and Renovate cannot add a Signed-off-by trailer to the
    # commits they generate, so this gate can never pass on their branches.
    # Their pull requests are machine-generated from repository configuration
    # rather than contributed work, so the certification the DCO records does
    # not apply. Human-authored pull requests are unaffected.
    if: >-
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.user.login != 'renovate[bot]'
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify DCO trailers
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: ./scripts/check-dco.sh "$BASE_SHA" "$HEAD_SHA"
