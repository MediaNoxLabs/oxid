name: Documentation links

on:
  pull_request:
  workflow_dispatch: {}
  schedule:
    - cron: "30 4 * * 0"

permissions:
  contents: read

concurrency:
  group: oxid-doc-links-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-context:
    name: Check documentation links
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Defer outbound link probes
        run: echo "Documentation link probes run weekly or on demand."

  links:
    name: Check documentation links
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Check Markdown links
        # The docs-only shell carries no compiler or Compact/ZK artifact closure.
        run: nix develop .#docs --command node scripts/docs/check-links.mjs
