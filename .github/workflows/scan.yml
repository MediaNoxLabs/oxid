name: Scan

on:
  push:
    branches: [develop, main, "milestone-*"]
  pull_request:
  workflow_dispatch: {}
  schedule:
    - cron: "0 0 * * *"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  scan:
    # Keep the required context stable and singular.
    name: scan
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Run scanners and upload SARIF
        id: security-scan
        # The pinned aggregate action runs scanners in parallel, collects all
        # SARIF, uploads it, and only then evaluates severity. Preserve that
        # result for the final job verdict instead of failing fast here.
        if: always()
        continue-on-error: true
        uses: midnightntwrk/upload-sarif-github-action@362d0346b194663004cb371e8e8523bd1c910917 # v1.0.3
        with:
          fail_severity: high
          skip_scorecard_scan: "true"

      - name: Aggregate scanner result
        if: always()
        env:
          SCAN_OUTCOME: ${{ steps.security-scan.outcome }}
        run: |
          failed=false
          if [ "$SCAN_OUTCOME" != success ]; then
            echo "::error::A scanner, SARIF upload, or severity gate failed."
            failed=true
          fi
          if $failed; then
            exit 1
          fi
