name: Scan

on:
  push:
    branches: [integration, develop, main]
  pull_request:
    branches: [integration, develop, main]
  workflow_dispatch: {}
  schedule:
    - cron: "0 0 * * *"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  scan:
    # Keep the required context stable and singular.
    name: scan
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Stage the authenticated synthetic JWT fixture exclusion
        id: stage-checkov-exclusion
        # Checkov CKV_SECRET_9 mistakes this manifest-authenticated negative JWT
        # for a credential. Exclude only that exact immutable public test vector;
        # do not skip Checkov, a framework, a check, or a broader path.
        continue-on-error: true
        run: |
          fixture="fixtures/laceid-portal/76e8edf394a4cb37ca822037272d543c68f25f71/openid4vci-final/negative/unsupported-proof-alg.json"
          mkdir -p "$RUNNER_TEMP/oxid-checkov-exclusion"
          mv -- "$fixture" "$RUNNER_TEMP/oxid-checkov-exclusion/fixture.json"

      - name: Run scanners and upload SARIF
        id: security-scan
        # The pinned aggregate action runs scanners in parallel, collects all
        # SARIF, uploads it, and only then evaluates severity. Preserve that
        # result for the final job verdict instead of failing fast here.
        if: always()
        continue-on-error: true
        uses: midnightntwrk/upload-sarif-github-action@4bbe849e9707b46342832d4b7f94fec585823ca4 # pinned main, 2026-07-10
        with:
          fail_severity: high
          skip_scorecard_scan: "true"

      - name: Restore the authenticated synthetic JWT fixture
        id: restore-checkov-exclusion
        if: always()
        continue-on-error: true
        run: |
          fixture="fixtures/laceid-portal/76e8edf394a4cb37ca822037272d543c68f25f71/openid4vci-final/negative/unsupported-proof-alg.json"
          mv -- "$RUNNER_TEMP/oxid-checkov-exclusion/fixture.json" "$fixture"

      - name: Aggregate scanner and fixture results
        if: always()
        env:
          STAGE_OUTCOME: ${{ steps.stage-checkov-exclusion.outcome }}
          SCAN_OUTCOME: ${{ steps.security-scan.outcome }}
          RESTORE_OUTCOME: ${{ steps.restore-checkov-exclusion.outcome }}
        run: |
          failed=false
          if [ "$STAGE_OUTCOME" != success ]; then
            echo "::error::The exact synthetic JWT exclusion could not be staged."
            failed=true
          fi
          if [ "$SCAN_OUTCOME" != success ]; then
            echo "::error::A scanner, SARIF upload, or severity gate failed."
            failed=true
          fi
          if [ "$RESTORE_OUTCOME" != success ]; then
            echo "::error::The exact synthetic JWT fixture could not be restored."
            failed=true
          fi
          if $failed; then
            exit 1
          fi
