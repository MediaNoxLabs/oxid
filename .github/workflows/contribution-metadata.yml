name: Contribution metadata

on:
  # Trusted base workflow. Pull-request fields are untrusted data and are
  # passed only through environment variables to the base policy parser.
  # zizmor: ignore[dangerous-triggers] trusted-base metadata only; candidate code is never executed
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review, converted_to_draft]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: contribution-metadata-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Report PR metadata policy
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Mark exact-head metadata policies pending
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const targetUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            for (const policy of [
              ['Validate PR title', 'PR title policy is running'],
              ['Validate PR body', 'PR body policy is running'],
            ]) {
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: context.payload.pull_request.head.sha,
                state: 'pending',
                context: policy[0],
                description: policy[1],
                target_url: targetUrl,
              });
            }

      - name: Checkout trusted contribution policy
        id: checkout
        continue-on-error: true
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.workflow_sha }}
          path: policy
          fetch-depth: 1
          persist-credentials: false

      - name: Validate title, scope, and branch
        id: title
        if: steps.checkout.outcome == 'success'
        continue-on-error: true
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_ACTOR: ${{ github.event.pull_request.user.login }}
        run: node policy/scripts/ci/contribution-policy.mjs pr

      - name: Validate PR body
        id: body
        if: steps.checkout.outcome == 'success'
        continue-on-error: true
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_ACTOR: ${{ github.event.pull_request.user.login }}
        run: node policy/scripts/ci/contribution-policy.mjs body

      - name: Publish exact-head advisory statuses
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TITLE_PASSED: ${{ steps.checkout.outcome == 'success' && steps.title.outcome == 'success' }}
          BODY_PASSED: ${{ steps.checkout.outcome == 'success' && steps.body.outcome == 'success' }}
        with:
          script: |
            const targetUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const statuses = [
              {
                context: 'Validate PR title',
                passed: process.env.TITLE_PASSED === 'true',
                success: 'Conventional title, scope, and branch passed',
                advisory: 'Advisory: title, scope, or branch policy failed',
              },
              {
                context: 'Validate PR body',
                passed: process.env.BODY_PASSED === 'true',
                success: 'Pull request body closes its branch issue',
                advisory: 'Advisory: PR body policy failed',
              },
            ];
            for (const status of statuses) {
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: context.payload.pull_request.head.sha,
                state: 'success',
                context: status.context,
                description: status.passed ? status.success : status.advisory,
                target_url: targetUrl,
              });
            }
            const failed = statuses.filter((status) => !status.passed).map((status) => status.context);
            if (failed.length > 0) core.warning(`PR metadata findings are advisory: ${failed.join(', ')}.`);
