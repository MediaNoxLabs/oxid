version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    target-branch: integration
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    labels: [dependencies]
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)
    groups:
      dioxus:
        patterns: ["dioxus", "dioxus-*"]
        update-types: [minor, patch]
      rust-runtime:
        dependency-type: production
        exclude-patterns: ["dioxus", "dioxus-*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: integration
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: UTC
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    labels: [dependencies, github-actions]
    commit-message:
      prefix: ci(deps)
    groups:
      github-actions:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
