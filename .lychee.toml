# Slow or briefly unreachable hosts must not fail the whole check: retry
# before declaring failure, and allow slow responders (nixos.org has twice
# timed out from GitHub runners while serving 200s from elsewhere).
max_retries = 3
timeout = 45

# The workflow badge returns 404 until the CI workflow exists on `develop`.
# Keep checking its destination link while allowing the generated badge image.
# Apple and Android Developer documentation reject automated GitHub-hosted
# clients, and midnight.network rate-limits them with 429 regardless of
# pacing; retain the reviewed references while excluding only those exact
# upstream URLs.
exclude = [
  'https://github\.com/MediaNoxLabs/oxid/actions/workflows/ci\.yml/badge\.svg.*',
  'https://midnight\.network/$',
  'https://developer\.apple\.com/documentation/security/protecting-keys-with-the-secure-enclave$',
  'https://developer\.apple\.com/documentation/security/restricting-keychain-item-accessibility$',
  'https://developer\.android\.com/privacy-and-security/keystore$',
  'https://developer\.android\.com/reference/android/content/Context#getNoBackupFilesDir\(\)$',
]
