# Local-only Maestro pilot. Run through scripts/run-maestro-ios.sh.
appId: io.medianox.oxid
name: Lunar Aegis iOS simulated holder journey
---
- launchApp:
    clearState: true
- assertVisible: "Create private wallet"
- takeScreenshot: lunar-aegis-ios-01-first-run
# Maestro records a screenshot automatically after a failed step. Never enter
# the recovery ceremony here: a later failure could otherwise retain a phrase.
# The compile-time demo drawer reaches a deterministic empty holder shell
# without handling a private value.
- tapOn: "Open standalone demo setup"
- tapOn: "Run full demo setup"
- extendedWaitUntil:
    visible: "Accept a credential offer"
    timeout: 60000
- tapOn: "Dismiss identity request"
- tapOn: "Home"
- assertVisible: "Current realm"
- takeScreenshot: lunar-aegis-ios-02-home-empty
- tapOn: "Receive"
- assertVisible: "Receive assets"
- takeScreenshot: lunar-aegis-ios-03-receive
- tapOn: "Close Receive"
- tapOn: "Send"
- assertVisible: "Send"
- takeScreenshot: lunar-aegis-ios-04-send-prerequisite
- tapOn: "Documents"
- assertVisible: "Documents"
- takeScreenshot: lunar-aegis-ios-05-documents-empty
- tapOn: "Activity"
- assertVisible: "Activity"
- takeScreenshot: lunar-aegis-ios-06-activity-empty
- tapOn: "Open global application menu"
- tapOn: "Settings"
- assertVisible: "Settings"
- takeScreenshot: lunar-aegis-ios-07-settings
