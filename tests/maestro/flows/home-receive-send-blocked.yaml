appId: io.medianox.oxid
name: home receive send entry
---
- runFlow: ../subflows/launch-clean.yaml
- runFlow: ../subflows/demo-profile.yaml
- tapOn: "Receive"
- assertVisible: "Receive assets"
- tapOn: "Close Receive"
- tapOn: "Send"
- assertVisible: "SEND NIGHT"
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "Go back"
- assertVisible: "Current realm"
