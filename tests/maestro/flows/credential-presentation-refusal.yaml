appId: io.medianox.oxid
name: credential presentation consent boundary and refusal
---
- runFlow: ../subflows/launch-clean.yaml
- runFlow: ../subflows/demo-profile.yaml
- tapOn: "Open standalone demo setup"
- tapOn: "Run full demo setup"
- extendedWaitUntil:
    visible: "Safe setup complete. The credential offer is waiting on its existing review screen."
    timeout: 120000
- tapOn: "Preview credential offer"
- scrollUntilVisible:
    element:
      text: "Credential offer preview"
    direction: DOWN
    timeout: 60000
- tapOn: "Consent to credential issuance"
- tapOn: "Accept and issue credential"
- extendedWaitUntil:
    visible: "Credential issued, verified, and stored in the protected inventory."
    timeout: 60000
- tapOn: "Open standalone demo setup"
- scrollUntilVisible:
    element:
      text: "Run demo action: Review presentation request"
    direction: DOWN
- tapOn: "Run demo action: Review presentation request"
- scrollUntilVisible:
    element:
      text: "Preview presentation request"
    direction: DOWN
- tapOn: "Preview presentation request"
- scrollUntilVisible:
    element:
      text: "Presentation preview"
    direction: DOWN
    timeout: 60000
- scrollUntilVisible:
    element:
      text: "Who is asking?"
    direction: DOWN
- scrollUntilVisible:
    element:
      text: "What will be shared?"
    direction: DOWN
- scrollUntilVisible:
    element:
      text: "Which document?"
    direction: DOWN
- scrollUntilVisible:
    element:
      text: "Why is it requested?"
    direction: DOWN
- scrollUntilVisible:
    element:
      text: "Consent to credential presentation"
    direction: DOWN
- scrollUntilVisible:
    element:
      text: "No presentation or vp_token has been generated."
    direction: DOWN
- scrollUntilVisible:
    element:
      text: "Refuse request"
    direction: DOWN
- tapOn: "Refuse request"
- scrollUntilVisible:
    element:
      text: "Presentation refused; the one-time verifier session was discarded."
    direction: UP
    timeout: 60000
- scrollUntilVisible:
    element:
      text: "Presentation refused. No presentation or vp_token was generated. You can safely preview a new request."
    direction: DOWN
    timeout: 60000
- assertNotVisible: "Consent to credential presentation"
