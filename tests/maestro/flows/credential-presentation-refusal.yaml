appId: io.medianox.oxid
name: credential presentation consent boundary and refusal
---
- runFlow: ../subflows/launch-clean.yaml
- runFlow: ../subflows/demo-profile.yaml
- tapOn: "Open standalone demo setup"
- tapOn: "Run full demo setup"
- extendedWaitUntil:
    visible: "Safe setup complete. The credential offer is waiting on its existing review screen."
    timeout: 120000
- tapOn: "Preview credential offer"
- assertVisible: "Credential offer preview"
- tapOn: "Consent to credential issuance"
- tapOn: "Accept and issue credential"
- extendedWaitUntil:
    visible: "Credential issued, verified, and stored in the protected inventory."
    timeout: 60000
- tapOn: "Open standalone demo setup"
- tapOn: "Run demo action: Review presentation request"
- assertVisible: "Fixture loaded. Review the exact existing consent screen; nothing was accepted or executed."
- tapOn: "Preview presentation request"
- extendedWaitUntil:
    visible: "Presentation preview"
    timeout: 60000
- assertVisible: "Who is asking?"
- assertVisible: "What will be shared?"
- assertVisible: "Which document?"
- assertVisible: "Why is it requested?"
- assertVisible: "Consent to credential presentation"
- assertVisible: "No presentation or vp_token has been generated."
- tapOn: "Refuse request"
- extendedWaitUntil:
    visible: "Presentation refused; the one-time verifier session was discarded."
    timeout: 60000
- assertVisible: "Presentation refused. No presentation or vp_token was generated. You can safely preview a new request."
- assertNotVisible: "Consent to credential presentation"
