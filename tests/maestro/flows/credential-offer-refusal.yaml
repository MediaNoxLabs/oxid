appId: io.medianox.oxid
name: credential offer consent boundary and refusal
---
- runFlow: ../subflows/launch-clean.yaml
- runFlow: ../subflows/demo-profile.yaml
- tapOn: "Open standalone demo setup"
- tapOn: "Run demo action: Review credential offer"
- assertVisible: "Fixture loaded. Review the exact existing consent screen; nothing was accepted or executed."
- tapOn: "Preview credential offer"
- assertVisible: "Credential offer preview"
- assertVisible: "Consent to credential issuance"
- tapOn: "Refuse offer"
- extendedWaitUntil:
    visible: "Credential offer refused; ephemeral protocol secrets were discarded."
    timeout: 60000
- assertVisible: "Offer closed"
- assertNotVisible: "Consent to credential issuance"
