appId: io.medianox.oxid
name: credential offer consent boundary and refusal
---
- runFlow: ../subflows/launch-clean.yaml
- runFlow: ../subflows/demo-profile.yaml
- tapOn: "Open standalone demo setup"
- scrollUntilVisible:
    element:
      text: "Run demo action: Review credential offer"
    direction: DOWN
- tapOn: "Run demo action: Review credential offer"
- scrollUntilVisible:
    element:
      text: "Preview credential offer"
    direction: DOWN
- tapOn: "Preview credential offer"
- scrollUntilVisible:
    element:
      text: "Credential offer preview"
    direction: DOWN
    timeout: 60000
- scrollUntilVisible:
    element:
      text: "Consent to credential issuance"
    direction: DOWN
    timeout: 60000
- scrollUntilVisible:
    element:
      text: "Refuse offer"
    direction: DOWN
    timeout: 60000
- tapOn: "Refuse offer"
- scrollUntilVisible:
    element:
      text: "Credential offer refused; ephemeral protocol secrets were discarded."
    direction: UP
    timeout: 60000
- scrollUntilVisible:
    element:
      text: "Offer closed"
    direction: DOWN
    timeout: 60000
- assertNotVisible: "Consent to credential issuance"
