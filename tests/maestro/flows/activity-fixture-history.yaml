appId: io.medianox.oxid
name: activity fixture history
---
- runFlow: ../subflows/launch-clean.yaml
- runFlow: ../subflows/demo-profile.yaml
- tapOn: "Open standalone demo setup"
- scrollUntilVisible:
    element:
      text: "Run demo action: Derive Midnight account"
    direction: DOWN
- tapOn: "Run demo action: Derive Midnight account"
- extendedWaitUntil:
    visible: "Derived the existing protected 0/0 Midnight account idempotently."
    timeout: 60000
- scrollUntilVisible:
    element:
      text: "Run demo action: Load simulated funding"
    direction: DOWN
- tapOn: "Run demo action: Load simulated funding"
- extendedWaitUntil:
    visible: "Loaded the deterministic public 5 NIGHT funding snapshot; no chain was contacted."
    timeout: 60000
- scrollUntilVisible:
    element:
      text: "Close standalone demo setup"
    direction: UP
- tapOn: "Close standalone demo setup"
- tapOn: "Activity"
- assertVisible: "Activity"
- extendedWaitUntil:
    visible: "Sent"
    timeout: 60000
- scrollUntilVisible:
    element:
      text: "Received"
    direction: DOWN
- assertVisible: "Received"
# Fixture history proves reachability only; transaction lifecycle tests own finality.
