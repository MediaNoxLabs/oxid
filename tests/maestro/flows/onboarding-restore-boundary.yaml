appId: io.medianox.oxid
name: onboarding restore boundary
---
- runFlow: ../subflows/launch-clean.yaml
- scrollUntilVisible:
    element:
      text: "Restore 24-word.*"
    direction: DOWN
    speed: 40
    timeout: 20000
- tapOn: "Restore 24-word.*"
- scrollUntilVisible:
    element:
      text: "Name this wallet"
    direction: UP
    speed: 40
    timeout: 20000
- assertVisible: "Create an empty local profile before entering.*"
- tapOn: "Back to onboarding choices"
- assertVisible: "Create private wallet"
# Stop before profile creation, native authorization, or protected-word entry.
