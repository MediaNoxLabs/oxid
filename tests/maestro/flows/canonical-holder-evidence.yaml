appId: io.medianox.oxid
name: canonical iOS public holder evidence
---
- runFlow: ../subflows/launch-clean.yaml
- assertVisible: "Create private wallet"
- takeScreenshot: lunar-aegis-ios-01-first-run
- tapOn: "Create private wallet"
- scrollUntilVisible:
    element:
      text: "Create and continue"
    direction: DOWN
- tapOn: "Create and continue"
- assertVisible: "Device protection is required.*"
- takeScreenshot: lunar-aegis-ios-02-device-protection
# Relaunch instead of entering native authorization or the recovery ceremony.
- runFlow: ../subflows/launch-clean.yaml
- runFlow: ../subflows/demo-profile.yaml
- takeScreenshot: lunar-aegis-ios-03-home-empty
- tapOn: "Receive"
- assertVisible: "Receive assets"
- takeScreenshot: lunar-aegis-ios-04-receive
- tapOn: "Close Receive"
- tapOn: "Send"
- assertVisible: "SEND NIGHT"
- takeScreenshot: lunar-aegis-ios-05-send-entry
- tapOn: "Go back"
- tapOn: "Documents"
- assertVisible: "Documents"
- scrollUntilVisible:
    element:
      text: "No documents yet"
    direction: DOWN
- assertVisible: "No documents yet"
- takeScreenshot: lunar-aegis-ios-06-documents-empty
- tapOn: "Activity"
- assertVisible: "Activity"
- extendedWaitUntil:
    visible: "Sent"
    timeout: 60000
- takeScreenshot: lunar-aegis-ios-07-activity-history
- runFlow: ../subflows/open-menu.yaml
- tapOn: "Settings"
- assertVisible: "Settings"
- takeScreenshot: lunar-aegis-ios-08-settings
