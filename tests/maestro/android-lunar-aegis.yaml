# Local-only Maestro pilot. Run through scripts/run-maestro-android.sh.
appId: io.medianox.oxid
name: Lunar Aegis Android simulated holder journey
androidWebViewHierarchy: devtools
---
- launchApp:
    clearState: true
- assertVisible: "Create private wallet"
- takeScreenshot: lunar-aegis-android-01-first-run
# Maestro records a screenshot automatically after a failed step. Never enter
# the recovery ceremony here: a later failure could otherwise retain a phrase.
# The compile-time demo drawer reaches a deterministic empty holder shell
# without handling a private value.
- tapOn: "Open standalone demo setup"
- tapOn: "Run full demo setup"
- extendedWaitUntil:
    visible: "Accept a credential offer"
    timeout: 60000
- tapOn: "Dismiss identity request"
- tapOn: "Home"
- assertVisible: "Current realm"
# After wallet protection initializes, Android deliberately applies FLAG_SECURE.
# Maestro retains semantic transition evidence; #813 owns the missing header
# semantics needed to reach the explicit reveal and Settings controls.
- tapOn: "Receive"
- assertVisible: "Receive assets"
- tapOn: "Close Receive"
- assertVisible: "Current realm"
- tapOn: "Send"
- assertVisible: "Send"
- tapOn: "Documents"
- assertVisible: "Documents"
- tapOn: "Activity"
- assertVisible: "Activity"
