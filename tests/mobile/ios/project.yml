name: OxidMobileSmoke
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
targets:
  OxidUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ${OXID_REPOSITORY_ROOT}/tests/mobile/ios/OxidUITests
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: io.medianox.oxid.uitests
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: true
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  OxidUITests:
    build:
      targets:
        OxidUITests: test
    test:
      targets:
        - OxidUITests
