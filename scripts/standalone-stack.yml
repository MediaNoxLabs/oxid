name: oxid-standalone

# Reviewed standalone topology from midnight-ledger
# 074b1a4bccbfee1740ee188374b606a022ecef42. Host services stay on loopback;
# scripts/standalone-up.sh can expose them to one tailnet through TLS-terminated
# Tailscale Serve routes without committing a machine address.
services:
  proof-server:
    image: "${PROOF_SERVER_IMAGE:-midnightntwrk/proof-server:8.0.3}"
    command: ["midnight-proof-server -v"]
    ports:
      - "127.0.0.1:6300:6300"
    environment:
      RUST_BACKTRACE: "full"
    # The reviewed image is distroless and has no shell or HTTP probe binary.
    # standalone-up.sh therefore verifies readiness through the loopback route.

  indexer:
    image: "midnightntwrk/indexer-standalone:4.0.0"
    env_file: "${OXID_STANDALONE_ENV_FILE}"
    ports:
      - "127.0.0.1:8088:8088"
    environment:
      RUST_LOG: "indexer=info,chain_indexer=info,indexer_api=info,wallet_indexer=info,indexer_common=info,fastrace_opentelemetry=off,info"
      APP__APPLICATION__NETWORK_ID: "undeployed"
    healthcheck:
      test: ["CMD-SHELL", "cat /var/run/indexer-standalone/running"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    depends_on:
      node:
        condition: service_healthy

  node:
    image: "midnightntwrk/midnight-node:0.22.3"
    ports:
      - "127.0.0.1:9944:9944"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9944/health"]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 20s
    environment:
      CFG_PRESET: "dev"
      SIDECHAIN_BLOCK_BENEFICIARY: "04bcf7ad3be7a5c790460be82a713af570f22e0f801f6659ab8e84a52be6969e"
