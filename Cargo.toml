[workspace]
resolver = "3"
members = [
  "apps/oxid",
  "apps/oxid-headless",
  "crates/adapters/platform-system",
  "crates/adapters/midnight",
  "crates/adapters/openid4vci",
  "crates/adapters/openid4vp",
  "crates/adapters/passport-vault",
  "crates/adapters/siopv2",
  "crates/adapters/vc-midnight",
  "crates/adapters/did-midnight",
  "crates/adapters/storage-credential-json",
  "crates/adapters/storage-identity-json",
  "crates/adapters/storage-json",
  "crates/adapters/storage-memory",
  "crates/adapters/storage-dev",
  "crates/composition",
  "crates/credential/application",
  "crates/credential/domain",
  "crates/foundation",
  "crates/identity/application",
  "crates/identity/domain",
  "crates/platform/ports",
  "crates/presentation/application",
  "crates/presentation/domain",
  "crates/passport-vault/application",
  "crates/passport-vault/domain",
  "crates/protocol/application",
  "crates/protocol/domain",
  "crates/ui-dioxus",
  "crates/wallet/application",
  "crates/wallet/domain",
]
default-members = [
  "apps/oxid",
  "apps/oxid-headless",
  "crates/adapters/platform-system",
  "crates/adapters/midnight",
  "crates/adapters/openid4vci",
  "crates/adapters/openid4vp",
  "crates/adapters/passport-vault",
  "crates/adapters/siopv2",
  "crates/adapters/vc-midnight",
  "crates/adapters/did-midnight",
  "crates/adapters/storage-credential-json",
  "crates/adapters/storage-identity-json",
  "crates/adapters/storage-json",
  "crates/adapters/storage-memory",
  "crates/adapters/storage-dev",
  "crates/composition",
  "crates/credential/application",
  "crates/credential/domain",
  "crates/foundation",
  "crates/identity/application",
  "crates/identity/domain",
  "crates/platform/ports",
  "crates/presentation/application",
  "crates/presentation/domain",
  "crates/passport-vault/application",
  "crates/passport-vault/domain",
  "crates/protocol/application",
  "crates/protocol/domain",
  "crates/ui-dioxus",
  "crates/wallet/application",
  "crates/wallet/domain",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/MediaNoxLabs/oxid"
authors = ["Oxid contributors"]

[workspace.dependencies]
anyhow = { version = "=1.0.104" }
base64 = { version = "=0.22.1" }
bech32 = { version = "=0.11.0" }
chacha20poly1305 = { version = "=0.11.0", features = ["zeroize"] }
ciborium = { version = "=0.2.2" }
bip32 = { version = "=0.5.3", default-features = false, features = ["secp256k1", "std"] }
dioxus = { version = "=0.7.10", default-features = false }
directories = { version = "=6.0.0" }
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["fast", "zeroize"] }
futures = { version = "=0.3.33", default-features = false, features = ["executor"] }
getrandom = { version = "=0.3.4", features = ["wasm_js"] }
hex = { version = "=0.4.3" }
jni = { version = "=0.21.1" }
k256 = { version = "=0.13.4", default-features = false, features = ["schnorr", "std"] }
midnight-base-crypto = { version = "=1.0.0", git = "https://github.com/midnightntwrk/midnight-ledger.git", rev = "d9414884db9da9e9b1f6f3a7f742d79a5732f817", package = "midnight-base-crypto" }
midnight-coin-structure = { version = "=2.0.1", git = "https://github.com/midnightntwrk/midnight-ledger.git", rev = "d9414884db9da9e9b1f6f3a7f742d79a5732f817", package = "midnight-coin-structure" }
midnight-ledger = { version = "=8.2.0-rc.1", git = "https://github.com/midnightntwrk/midnight-ledger.git", rev = "d9414884db9da9e9b1f6f3a7f742d79a5732f817", default-features = false }
midnight-onchain-runtime = { version = "=3.1.0", git = "https://github.com/midnightntwrk/midnight-ledger.git", rev = "d9414884db9da9e9b1f6f3a7f742d79a5732f817", package = "midnight-onchain-runtime" }
midnight-serialize = { version = "=1.1.0", git = "https://github.com/midnightntwrk/midnight-ledger.git", rev = "d9414884db9da9e9b1f6f3a7f742d79a5732f817", package = "midnight-serialize" }
midnight-storage = { version = "=2.0.2", git = "https://github.com/midnightntwrk/midnight-ledger.git", rev = "d9414884db9da9e9b1f6f3a7f742d79a5732f817", package = "midnight-storage" }
midnight-transient-crypto = { version = "=2.1.0", git = "https://github.com/midnightntwrk/midnight-ledger.git", rev = "d9414884db9da9e9b1f6f3a7f742d79a5732f817", package = "midnight-transient-crypto" }
midnight-zkir = { version = "=2.1.0", git = "https://github.com/midnightntwrk/midnight-ledger.git", rev = "d9414884db9da9e9b1f6f3a7f742d79a5732f817", package = "midnight-zkir", default-features = false }
midnight-zswap = { version = "=8.2.0-rc.1", git = "https://github.com/midnightntwrk/midnight-ledger.git", rev = "d9414884db9da9e9b1f6f3a7f742d79a5732f817", package = "midnight-zswap", default-features = false }
ndk-context = { version = "=0.1.1" }
p256 = { version = "=0.14.0", default-features = false, features = ["ecdsa"] }
qrcode = { version = "=0.14.1", default-features = false, features = ["svg"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151" }
sha2 = { version = "=0.10.9", default-features = false }
rustls = { version = "=0.23.43", default-features = false, features = ["ring", "std"] }
rand = { version = "=0.8.5" }
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "rustls"] }
subxt = { version = "=0.44.3" }
tokio = { version = "=1.53.1", default-features = false, features = ["net", "rt", "time"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
url = { version = "=2.5.8" }
webpki-root-certs = "=1.0.9"
zeroize = { version = "=1.9.0" }

oxid-adapter-midnight = { version = "=0.1.0", path = "crates/adapters/midnight" }
oxid-adapter-openid4vci = { version = "=0.1.0", path = "crates/adapters/openid4vci" }
oxid-adapter-openid4vp = { version = "=0.1.0", path = "crates/adapters/openid4vp" }
oxid-adapter-passport-vault = { version = "=0.1.0", path = "crates/adapters/passport-vault" }
oxid-adapter-siopv2 = { version = "=0.1.0", path = "crates/adapters/siopv2" }
oxid-adapter-vc-midnight = { version = "=0.1.0", path = "crates/adapters/vc-midnight" }
oxid-adapter-did-midnight = { version = "=0.1.0", path = "crates/adapters/did-midnight" }
oxid-adapter-storage-credential-json = { version = "=0.1.0", path = "crates/adapters/storage-credential-json" }
oxid-adapter-storage-identity-json = { version = "=0.1.0", path = "crates/adapters/storage-identity-json" }
oxid-adapter-platform-system = { version = "=0.1.0", path = "crates/adapters/platform-system" }
oxid-adapter-storage-json = { version = "=0.1.0", path = "crates/adapters/storage-json" }
oxid-adapter-storage-memory = { version = "=0.1.0", path = "crates/adapters/storage-memory" }
oxid-adapter-storage-dev = { version = "=0.1.0", path = "crates/adapters/storage-dev" }
oxid-composition = { version = "=0.1.0", path = "crates/composition" }
oxid-credential-application = { version = "=0.1.0", path = "crates/credential/application" }
oxid-credential-domain = { version = "=0.1.0", path = "crates/credential/domain" }
oxid-foundation = { version = "=0.1.0", path = "crates/foundation" }
oxid-identity-application = { version = "=0.1.0", path = "crates/identity/application" }
oxid-identity-domain = { version = "=0.1.0", path = "crates/identity/domain" }
oxid-platform-ports = { version = "=0.1.0", path = "crates/platform/ports" }
oxid-presentation-application = { version = "=0.1.0", path = "crates/presentation/application" }
oxid-presentation-domain = { version = "=0.1.0", path = "crates/presentation/domain" }
oxid-passport-vault-application = { version = "=0.1.0", path = "crates/passport-vault/application" }
oxid-passport-vault-domain = { version = "=0.1.0", path = "crates/passport-vault/domain" }
oxid-protocol-application = { version = "=0.1.0", path = "crates/protocol/application" }
oxid-protocol-domain = { version = "=0.1.0", path = "crates/protocol/domain" }
oxid-ui-dioxus = { version = "=0.1.0", path = "crates/ui-dioxus" }
oxid-wallet-application = { version = "=0.1.0", path = "crates/wallet/application" }
oxid-wallet-domain = { version = "=0.1.0", path = "crates/wallet/domain" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
