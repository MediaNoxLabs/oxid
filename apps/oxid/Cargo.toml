[package]
name = "oxid-app"
description = "Oxid identity wallet application shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
build = "build.rs"

[features]
default = ["desktop"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile", "oxid-ui-dioxus/mobile"]
web = ["dioxus/web"]
# Explicit simulator/emulator composition. This never changes the default
# production-facing composition selected by a normal application build.
standalone-development = []
# Explicit simulator/emulator composition using production native custody and
# deterministic standalone wallet/SSI adapters.
standalone-native-custody = []
# Opt-in iOS/Android standalone proof conformance harness. This embeds the
# reviewed Compact artifact closure and selects the foreground-only worker;
# normal mobile and production builds remain proof-disabled.
standalone-native-proving-artifacts = [
  "standalone-native-custody",
  "oxid-composition/mobile-compact-artifacts",
]
# Android smoke-only composition that proves a thrown JNI exception cannot
# poison subsequent native wallet calls.
android-jni-exception-recovery-test = [
  "oxid-composition/android-jni-exception-recovery-test",
]

[dependencies]
dioxus = { workspace = true, features = ["launch"] }
oxid-composition.workspace = true
oxid-ui-dioxus.workspace = true

[build-dependencies]
oxid-brand-build.workspace = true

[lints]
workspace = true
