[package]
name = "oxid-app"
description = "Oxid identity wallet application shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
build = "build.rs"

[features]
default = ["desktop"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile", "oxid-ui-dioxus/mobile"]
web = ["dioxus/web"]
# Opt-in developer presentation profile. Composition authority remains with a
# standalone feature and is compile-time guarded in main.rs.
ui-profile-dev = ["oxid-ui-dioxus/ui-profile-dev"]
# Opt-in fixture bootstrap presentation. It is accepted only with the
# deterministic standalone-development composition.
ui-profile-demo = ["oxid-ui-dioxus/ui-profile-demo"]
# Explicit simulator/emulator composition. This never changes the default
# production-facing composition selected by a normal application build.
standalone-development = []
# Opt-in native development route profile for the laptop-hosted standalone
# stack. Routes are immutable loopback constants; Android emulators reach them
# only through repository-owned adb reverse mappings.
standalone-local = []
# Opt-in physical-device route profile for a TLS-terminated standalone stack.
# Every route is supplied at compile time by the repository launcher; normal
# and native-custody builds cannot select it.
standalone-tailnet = []
# Explicit simulator/emulator composition using production native custody and
# deterministic standalone wallet/SSI adapters.
standalone-native-custody = []
# Opt-in iOS/Android standalone proof conformance harness. This embeds the
# reviewed Compact artifact closure and selects the foreground-only worker;
# normal mobile and production builds remain proof-disabled.
standalone-native-proving-artifacts = [
  "standalone-native-custody",
  "oxid-composition/mobile-compact-artifacts",
]
# Android smoke-only composition that proves a thrown JNI exception cannot
# poison subsequent native wallet calls.
android-jni-exception-recovery-test = [
  "oxid-composition/android-jni-exception-recovery-test",
]

[dependencies]
dioxus = { workspace = true, features = ["launch"] }
oxid-composition.workspace = true
oxid-ui-dioxus.workspace = true

# Tier-2 browser entropy backends. Three `getrandom` majors resolve in the
# wasm32 graph and each one refuses to build for `wasm32-unknown-unknown`
# until its JavaScript backend feature is enabled: 0.3 through the workspace
# pin, 0.2 through the Midnight proof/curve stack, and 0.4 through the
# RustCrypto `crypto-common` stack. Cargo can only enable a transitive feature
# from a manifest that declares the crate, and the browser shell is the one
# graph root that owns the target choice, so the two indirect majors are
# selected here instead of inside an adapter that never names them. The
# `cfg(target_arch = "wasm32")` scope keeps the Tier-1 Android/iOS and
# desktop graphs free of `wasm-bindgen` and `js-sys`.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom_02 = { package = "getrandom", version = "=0.2.17", features = ["js"] }
getrandom_04 = { package = "getrandom", version = "=0.4.3", features = [
  "wasm_js",
] }

[build-dependencies]
oxid-brand-build.workspace = true

[lints]
workspace = true
