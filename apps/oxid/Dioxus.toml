[application]
name = "oxid"
default_platform = "desktop"
android_main_activity = "android/MainActivity.kt"

[bundle]
identifier = "io.medianox.oxid"
publisher = "MediaNoxLabs"

[deep_links]
schemes = ["openid-credential-offer", "openid4vp"]

[ios]
deployment_target = "15.0"

[ios.plist]
NSCameraUsageDescription = "Scan credential offers and identity requests into your Oxid wallet."
NSFaceIDUsageDescription = "Authorize access to your protected Oxid wallet."

[android]
min_sdk = 23
target_sdk = 35
