<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Oxid - Credentials</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Space+Grotesk:wght@700&family=JetBrains+Mono:wght@400;500&display=swap');

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #07090E;
            color: #F8FAFC;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }

        .font-heading { font-family: 'Space Grotesk', sans-serif; }
        .mono { font-family: 'JetBrains Mono', monospace; }

        .glass {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(30, 41, 59, 0.5);
        }

        .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
        .safe-top { padding-top: env(safe-area-inset-top); }

        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <!-- Header -->
    <header id="header" class="safe-top sticky top-0 z-50 glass border-b border-[#1E293B]">
        <div class="px-5 py-4 flex items-center justify-between">
            <h1 class="text-xl font-heading font-bold tracking-tight">Credentials</h1>
            <div class="flex gap-2">
                <button aria-label="Manage identities" class="w-10 h-10 rounded-xl glass border border-[#1E293B] flex items-center justify-center text-slate-400 active:scale-95 transition-all hover:text-white">
                    <i class="fa-solid fa-fingerprint text-sm"></i>
                </button>
                <button aria-label="Add credential" class="w-10 h-10 rounded-xl bg-cyan-600 flex items-center justify-center text-oxid-bg active:scale-95 transition-all shadow-lg shadow-cyan-900/20">
                    <i class="fa-solid fa-plus text-sm"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-grow flex flex-col px-5 py-8 pb-24">

        <!-- Empty State Container -->
        <div class="flex-grow flex flex-col items-center justify-center text-center space-y-8 max-w-sm mx-auto">

            <!-- Visual Anchor -->
            <div class="relative group">
                <div class="w-24 h-24 rounded-3xl bg-[#0F172A] flex items-center justify-center border border-[#1E293B] text-slate-700 shadow-inner group-hover:border-cyan-500/20 transition-all">
                    <i class="fa-solid fa-address-card text-4xl"></i>
                </div>
                <div class="absolute -bottom-2 -right-2 w-10 h-10 rounded-full bg-cyan-600 flex items-center justify-center text-[10px] border-4 border-[#07090E] text-oxid-bg">
                    <i class="fa-solid fa-search"></i>
                </div>
            </div>

            <div class="space-y-3">
                <h2 class="text-2xl font-heading font-bold text-white">No credentials yet</h2>
                <p class="text-[14px] text-slate-500 leading-relaxed">
                    Add a credential offer or scan a QR code to start your document collection.
                </p>
            </div>

            <!-- Primary Actions -->
            <div class="w-full space-y-3">
                <button class="w-full py-4 bg-cyan-600 hover:bg-cyan-500 text-oxid-bg rounded-[20px] font-bold text-[14px] uppercase tracking-widest transition-all flex items-center justify-center gap-3 shadow-lg shadow-cyan-900/20">
                    <i class="fa-solid fa-qrcode"></i>
                    Scan to Add
                </button>
                <button class="w-full py-4 bg-[#0F172A] hover:bg-[#1E293B] text-white border border-[#1E293B] rounded-[20px] font-bold text-[14px] uppercase tracking-widest transition-all flex items-center justify-center gap-3">
                    <i class="fa-solid fa-user-gear text-slate-500"></i>
                    Manage Identities
                </button>
            </div>

        </div>

        <!-- Identity Privacy Tip -->
        <section class="mt-auto pt-10">
            <div class="bg-violet-950/10 border border-violet-500/20 rounded-[24px] p-5 flex gap-4">
                <div class="w-12 h-12 shrink-0 flex items-center justify-center rounded-xl bg-violet-500/20 text-violet-400">
                    <i class="fa-solid fa-shield-halved text-xl"></i>
                </div>
                <div class="space-y-1">
                    <p class="text-sm font-bold text-violet-100 tracking-tight">Privacy First</p>
                    <p class="text-[12px] text-slate-500 leading-snug">Review each request before sharing. Available proof options depend on the credential and verifier.</p>
                </div>
            </div>
        </section>

    </main>

    <!-- Navigation Bar -->
    <nav id="nav" aria-label="Primary navigation" style="position:fixed;bottom:0;left:0;right:0;z-index:50;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;background:#07090E;border-top:1px solid #1E293B;padding:7px 6px calc(7px + env(safe-area-inset-bottom));box-shadow:0 -8px 28px rgba(0,0,0,.25)">
<button type="button" aria-label="Home" style="min-height:56px;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;background:transparent;color:#94A3B8;font:600 11px/1.1 system-ui,sans-serif;cursor:pointer"><span style="width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:6px;background:transparent;color:inherit"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span><span>Home</span></button>
<button type="button" aria-label="Wallet" style="min-height:56px;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;background:transparent;color:#94A3B8;font:600 11px/1.1 system-ui,sans-serif;cursor:pointer"><span style="width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:6px;background:transparent;color:inherit"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/></svg></span><span>Wallet</span></button>
<button type="button" aria-label="Scan" style="min-height:56px;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;background:transparent;color:#94A3B8;font:600 11px/1.1 system-ui,sans-serif;cursor:pointer"><span style="width:42px;height:42px;display:flex;align-items:center;justify-content:center;border-radius:14px;background:linear-gradient(135deg,#38BDF8,#06B6D4);color:#07131d"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 12h10"/></svg></span><span>Scan</span></button>
<button type="button" aria-label="Documents" aria-current="page" style="min-height:56px;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;background:transparent;color:#06B6D4;font:600 11px/1.1 system-ui,sans-serif;cursor:pointer"><span style="width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:6px;background:transparent;color:inherit"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.85 8.62a4 4 0 0 1 4.78-4.77 4 4 0 0 1 6.74 0 4 4 0 0 1 4.78 4.78 4 4 0 0 1 0 6.74 4 4 0 0 1-4.77 4.78 4 4 0 0 1-6.75 0 4 4 0 0 1 0-6.76Z"/><path d="m9 12 2 2 4-4"/></svg></span><span>Documents</span><span aria-hidden="true" style="width:16px;height:2px;border-radius:2px;background:#06B6D4"></span></button>
<button type="button" aria-label="Activity" style="min-height:56px;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;background:transparent;color:#94A3B8;font:600 11px/1.1 system-ui,sans-serif;cursor:pointer"><span style="width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:6px;background:transparent;color:inherit"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.5.5 0 0 1-.96 0L9.24 2.18a.5.5 0 0 0-.96 0l-2.35 8.36A2 2 0 0 1 4 12H2"/></svg></span><span>Activity</span></button>
</nav>
</body>
</html>
