<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Settings — Oxid</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&family=Space+Grotesk:wght@700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'oxid-bg': '#07090E',
                        'oxid-surface': '#0F172A',
                        'oxid-border': '#1E293B',
                        'oxid-primary': '#06B6D4',
                        'oxid-highlight': '#38BDF8',
                        'oxid-identity': '#8B5CF6',
                        'oxid-text': '#F8FAFC',
                        'oxid-muted': '#94A3B8',
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        heading: ['Space Grotesk', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>
<style>html,body{background:#07090E;color:#F8FAFC}body{margin:0}</style>
</head>
<body class="bg-oxid-bg text-oxid-text font-sans overflow-hidden flex justify-center">
    <div class="w-full max-w-[430px] h-[840px] relative flex flex-col">

        <!-- Header -->
        <header class="px-6 pt-12 pb-4 flex items-center gap-4 sticky top-0 bg-oxid-bg/80 backdrop-blur-md z-10">
            <button class="w-11 h-11 rounded-xl bg-oxid-surface border border-oxid-border flex items-center justify-center text-oxid-muted hover:text-white transition-colors">
                <i class="fa-solid fa-chevron-left text-sm"></i>
            </button>
            <h1 class="text-2xl font-heading font-bold text-white tracking-tight">Settings</h1>
        </header>

        <main class="flex-1 px-6 pb-32 overflow-y-auto space-y-9 pt-4">

            <!-- Profile Summary -->
            <section id="profile-summary" class="flex items-center gap-5 p-2">
                <div class="w-16 h-16 rounded-[24px] bg-oxid-surface flex items-center justify-center text-oxid-primary border border-oxid-border font-heading font-bold text-xl shadow-2xl relative">
                    <div class="absolute inset-0 bg-oxid-primary/5 blur-xl"></div>\n                    <img src="https://storage.googleapis.com/uxpilot-auth.appspot.com/mcp-canvas-assets/sbo9HjaII9WGCx7j4TzA5Z7aWnH2/r30d8UxUa7xuLus8ZH2j/1790500071694-eccfe7a6-4733-425a-817f-a47b5ab3bb98-New-brand-reference-OXID-Lunar-Aegis-master-vector.svg" alt="OXID Lunar Aegis" class="w-12 h-12 rounded-xl relative object-cover" />\n                </div>
                <div>
                    <h2 class="text-[17px] font-bold text-white tracking-tight">Local Profile</h2>
                    <p class="text-[11px] font-bold text-oxid-muted uppercase tracking-widest mt-0.5">Truthful Simulated State</p>
                </div>
            </section>

            <!-- Security & Access -->
            <section id="security-section" class="space-y-4">
                <h3 class="text-[10px] font-bold uppercase tracking-[0.2em] text-oxid-muted px-1">Security & Access</h3>
                <div class="space-y-3">
                    <button class="w-full bg-oxid-surface rounded-[24px] p-5 border border-oxid-border flex items-center gap-4 text-left transition-all active:scale-[0.98] hover:border-oxid-primary/30 group shadow-xl">
                        <div class="w-12 h-12 rounded-xl bg-oxid-bg border border-oxid-border flex items-center justify-center text-oxid-primary">
                            <i class="fa-solid fa-shield-halved text-lg"></i>
                        </div>
                        <div class="flex-grow">
                            <p class="text-[15px] font-bold text-white tracking-tight">Device Protection</p>
                            <p class="text-[11px] text-oxid-muted font-medium mt-0.5">Proposed biometric security</p>
                        </div>
                        <i class="fa-solid fa-chevron-right text-oxid-border group-hover:text-oxid-primary transition-colors"></i>
                    </button>
                    <button class="w-full bg-oxid-surface rounded-[24px] p-5 border border-oxid-border flex items-center gap-4 text-left transition-all active:scale-[0.98] hover:border-oxid-identity/30 group shadow-xl">
                        <div class="w-12 h-12 rounded-xl bg-oxid-bg border border-oxid-border flex items-center justify-center text-oxid-identity">
                            <i class="fa-solid fa-eye text-lg"></i>
                        </div>
                        <div class="flex-grow">
                            <p class="text-[15px] font-bold text-white tracking-tight">Privacy Controls</p>
                            <p class="text-[11px] text-oxid-muted font-medium mt-0.5">Masking & visibility settings</p>
                        </div>
                        <i class="fa-solid fa-chevron-right text-oxid-border group-hover:text-oxid-identity transition-colors"></i>
                    </button>
                </div>
            </section>

            <!-- Data & Continuity -->
            <section id="data-section" class="space-y-4">
                <h3 class="text-[10px] font-bold uppercase tracking-[0.2em] text-oxid-muted px-1">Data & Continuity</h3>
                <div class="space-y-3">
                    <button class="w-full bg-oxid-surface rounded-[24px] p-5 border border-oxid-border flex items-center gap-4 text-left transition-all active:scale-[0.98] hover:border-amber-500/30 group shadow-xl">
                        <div class="w-12 h-12 rounded-xl bg-oxid-bg border border-oxid-border flex items-center justify-center text-amber-500">
                            <i class="fa-solid fa-cloud-arrow-up text-lg"></i>
                        </div>
                        <div class="flex-grow">
                            <div class="flex items-center gap-2 mb-0.5">
                                <p class="text-[15px] font-bold text-white tracking-tight">Backup & Export</p>
                                <span class="text-[8px] bg-amber-500/10 text-amber-500 px-1.5 py-0.5 rounded border border-amber-500/20 font-bold uppercase tracking-widest">Review</span>
                            </div>
                            <p class="text-[11px] text-oxid-muted font-medium">Unknown backup confidence</p>
                        </div>
                        <i class="fa-solid fa-chevron-right text-oxid-border group-hover:text-amber-500 transition-colors"></i>
                    </button>
                    <button class="w-full bg-oxid-surface rounded-[24px] p-5 border border-oxid-border flex items-center gap-4 text-left transition-all active:scale-[0.98] hover:border-oxid-highlight/30 group shadow-xl">
                        <div class="w-12 h-12 rounded-xl bg-oxid-bg border border-oxid-border flex items-center justify-center text-oxid-highlight">
                            <i class="fa-solid fa-rotate-left text-lg"></i>
                        </div>
                        <div class="flex-grow">
                            <p class="text-[15px] font-bold text-white tracking-tight">Restore / Recovery</p>
                            <p class="text-[11px] text-oxid-muted font-medium mt-0.5">Proposed profile recovery</p>
                        </div>
                        <i class="fa-solid fa-chevron-right text-oxid-border group-hover:text-oxid-highlight transition-colors"></i>
                    </button>
                </div>
            </section>

            <!-- System -->
            <section id="system-section" class="space-y-4">
                <h3 class="text-[10px] font-bold uppercase tracking-[0.2em] text-oxid-muted px-1">System</h3>
                <div class="space-y-3">
                    <button class="w-full bg-oxid-surface rounded-[24px] p-5 border border-oxid-border flex items-center gap-4 text-left transition-all active:scale-[0.98] hover:border-oxid-muted/30 group shadow-xl">
                        <div class="w-12 h-12 rounded-xl bg-oxid-bg border border-oxid-border flex items-center justify-center text-oxid-muted">
                            <i class="fa-solid fa-microchip text-lg"></i>
                        </div>
                        <div class="flex-grow">
                            <p class="text-[15px] font-bold text-white tracking-tight">Diagnostics</p>
                            <p class="text-[11px] text-oxid-muted font-medium mt-0.5">Network status & logs</p>
                        </div>
                        <i class="fa-solid fa-chevron-right text-oxid-border group-hover:text-white transition-colors"></i>
                    </button>
                    <button class="w-full bg-oxid-surface rounded-[24px] p-5 border border-oxid-border flex items-center gap-4 text-left transition-all active:scale-[0.98] hover:border-oxid-primary/30 group shadow-xl">
                        <div class="w-12 h-12 rounded-xl bg-oxid-bg border border-oxid-border flex items-center justify-center text-oxid-primary/50">
                            <i class="fa-solid fa-circle-info text-lg"></i>
                        </div>
                        <div class="flex-grow">
                            <p class="text-[15px] font-bold text-white tracking-tight">About Oxid</p>
                            <p class="text-[11px] text-oxid-muted font-medium mt-0.5">Design concept · 0.2.0</p>
                        </div>
                        <i class="fa-solid fa-chevron-right text-oxid-border group-hover:text-oxid-primary transition-colors"></i>
                    </button>
                </div>
            </section>

            <!-- Dangerous -->
            <section id="danger-section" class="pt-4 pb-10">
                <button class="w-full border border-rose-500/20 bg-rose-500/5 rounded-[24px] p-5 flex items-center justify-center gap-3 text-rose-400 active:scale-[0.96] transition-all font-bold text-[13px] uppercase tracking-widest">
                    <i class="fa-solid fa-trash-can"></i>
                    Reset Wallet
                </button>
                <p class="text-center text-[10px] text-oxid-muted mt-6 leading-relaxed px-8 font-medium">
                    Reset is destructive. Verification of backup and impact assessment required before enabling.
                </p>
            </section>

        </main>

        <!-- Navigation Bar -->
        <nav id="nav" aria-label="Primary navigation" style="position:fixed;bottom:0;left:0;right:0;z-index:50;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;background:#07090E;border-top:1px solid #1E293B;padding:7px 6px calc(7px + env(safe-area-inset-bottom));box-shadow:0 -8px 28px rgba(0,0,0,.25)">
        <button type="button" aria-label="Home" style="min-height:56px;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;background:transparent;color:#94A3B8;font:600 11px/1.1 system-ui,sans-serif;cursor:pointer"><span style="width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:6px;background:transparent;color:inherit"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span><span>Home</span></button>
        <button type="button" aria-label="Wallet" style="min-height:56px;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;background:transparent;color:#94A3B8;font:600 11px/1.1 system-ui,sans-serif;cursor:pointer"><span style="width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:6px;background:transparent;color:inherit"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/></svg></span><span>Wallet</span></button>
        <button type="button" aria-label="Scan" style="min-height:56px;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;background:transparent;color:#94A3B8;font:600 11px/1.1 system-ui,sans-serif;cursor:pointer"><span style="width:42px;height:42px;display:flex;align-items:center;justify-content:center;border-radius:14px;background:linear-gradient(135deg,#38BDF8,#06B6D4);color:#07131d"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 12h10"/></svg></span><span>Scan</span></button>
        <button type="button" aria-label="Documents" style="min-height:56px;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;background:transparent;color:#94A3B8;font:600 11px/1.1 system-ui,sans-serif;cursor:pointer"><span style="width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:6px;background:transparent;color:inherit"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.85 8.62a4 4 0 0 1 4.78-4.77 4 4 0 0 1 6.74 0 4 4 0 0 1 4.78 4.78 4 4 0 0 1 0 6.74 4 4 0 0 1-4.77 4.78 4 4 0 0 1-6.75 0 4 4 0 0 1 0-6.76Z"/><path d="m9 12 2 2 4-4"/></svg></span><span>Documents</span></button>
        <button type="button" aria-label="Activity" style="min-height:56px;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;background:transparent;color:#94A3B8;font:600 11px/1.1 system-ui,sans-serif;cursor:pointer"><span style="width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:6px;background:transparent;color:inherit"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.5.5 0 0 1-.96 0L9.24 2.18a.5.5 0 0 0-.96 0l-2.35 8.36A2 2 0 0 1 4 12H2"/></svg></span><span>Activity</span></button>
    </nav>

    </div>
</body>
