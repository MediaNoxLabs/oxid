<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Credential Detail — Oxid</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&family=Space+Grotesk:wght@700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'oxid-bg': '#07090E',
                        'oxid-surface': '#0F172A',
                        'oxid-border': '#1E293B',
                        'oxid-primary': '#06B6D4',
                        'oxid-highlight': '#38BDF8',
                        'oxid-identity': '#8B5CF6',
                        'oxid-text': '#F8FAFC',
                        'oxid-muted': '#94A3B8',
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        heading: ['Space Grotesk', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>
<style>html,body{background:#07090E;color:#F8FAFC}body{margin:0}</style>
</head>
<body class="bg-oxid-bg text-oxid-text font-sans overflow-hidden flex justify-center">
    <div class="w-full max-w-[430px] h-[840px] relative flex flex-col">

        <!-- Header -->
        <header class="px-6 pt-12 pb-4 flex items-center justify-between">
            <button class="w-11 h-11 rounded-xl bg-oxid-surface border border-oxid-border flex items-center justify-center text-oxid-muted hover:text-white transition-colors">
                <i class="fa-solid fa-chevron-left text-sm"></i>
            </button>
            <div class="flex flex-col items-center">
                <h1 class="text-sm font-heading font-bold text-white leading-tight">Example Credential</h1>
                <span class="text-[9px] text-oxid-primary font-bold uppercase tracking-[0.2em] italic">Example Status</span>
            </div>
            <button class="w-11 h-11 rounded-xl bg-oxid-surface border border-oxid-border flex items-center justify-center text-oxid-muted hover:text-white transition-colors">
                <i class="fa-solid fa-ellipsis-vertical text-sm"></i>
            </button>
        </header>

        <main class="flex-1 px-6 pb-28 overflow-y-auto">
            <!-- Card Large View (Identity Identity) -->
            <div class="aspect-[1.586/1] w-full bg-gradient-to-br from-oxid-surface to-oxid-bg rounded-[32px] p-8 border border-oxid-border mb-10 flex flex-col justify-between shadow-2xl relative overflow-hidden group">
                <div class="absolute top-0 right-0 p-8 opacity-5 group-hover:opacity-10 transition-opacity"><i class="fa-solid fa-building-columns text-8xl text-white"></i></div>
                <div class="absolute -bottom-10 -left-10 w-40 h-40 bg-oxid-primary/5 blur-3xl"></div>

                <div class="flex justify-between items-start relative z-10">
                    <div class="w-14 h-14 rounded-2xl bg-white/5 backdrop-blur-xl border border-white/10 flex items-center justify-center shadow-inner">
                        <i class="fa-solid fa-address-card text-2xl text-oxid-highlight"></i>
                    </div>
                    <div class="text-right">
                        <p class="text-[9px] text-oxid-muted font-bold uppercase tracking-widest mb-1">Global Bank</p>
                        <p class="text-[11px] font-bold text-white uppercase tracking-tighter">Premium Saver</p>
                    </div>
                </div>

                <div class="relative z-10">
                    <h2 class="text-2xl font-heading font-bold text-white mb-1">Example Holder</h2>
                    <p class="text-[13px] font-mono text-oxid-muted tracking-[0.25em]">•••• •••• •••• 1234</p>
                </div>
            </div>

            <!-- Info Sections -->
            <div class="space-y-10">
                <section>
                    <h3 class="text-[10px] font-bold text-oxid-muted uppercase tracking-[0.2em] mb-5 px-1">Document Information</h3>
                    <div class="space-y-5">
                        <div class="flex items-start gap-4">
                            <div class="w-11 h-11 rounded-xl bg-oxid-surface border border-oxid-border flex items-center justify-center text-oxid-muted"><i class="fa-solid fa-calendar-day text-lg"></i></div>
                            <div class="flex-1 border-b border-oxid-border/50 pb-5">
                                <p class="text-[9px] text-oxid-muted uppercase font-bold tracking-widest mb-1">Issued Date</p>
                                <p class="text-[14px] font-bold text-white">Date Unavailable</p>
                            </div>
                        </div>
                        <div class="flex items-start gap-4">
                            <div class="w-11 h-11 rounded-xl bg-oxid-surface border border-oxid-border flex items-center justify-center text-oxid-muted"><i class="fa-solid fa-shield-halved text-lg"></i></div>
                            <div class="flex-1 border-b border-oxid-border/50 pb-5">
                                <p class="text-[9px] text-oxid-muted uppercase font-bold tracking-widest mb-1">Verification Source</p>
                                <p class="text-[14px] font-bold text-white">Issuer Source Unavailable</p>
                            </div>
                        </div>
                        <div class="flex items-start gap-4">
                            <div class="w-11 h-11 rounded-xl bg-oxid-surface border border-oxid-border flex items-center justify-center text-oxid-muted"><i class="fa-solid fa-fingerprint text-lg"></i></div>
                            <div class="flex-1">
                                <p class="text-[9px] text-oxid-muted uppercase font-bold tracking-widest mb-1">Manage Identity</p>
                                <p class="text-[14px] font-bold text-white">Primary Personal Profile</p>
                            </div>
                        </div>
                    </div>
                </section>

                <section>
                    <h3 class="text-[10px] font-bold text-oxid-muted uppercase tracking-[0.2em] mb-5 px-1">Management</h3>
                    <div class="grid grid-cols-2 gap-4">
                        <button class="flex flex-col items-center justify-center p-5 rounded-[24px] bg-oxid-surface border border-oxid-border gap-3 hover:border-oxid-primary/30 transition-all active:scale-[0.98] group">
                            <i class="fa-solid fa-file-export text-xl text-oxid-primary group-hover:scale-110 transition-transform"></i>
                            <span class="text-[11px] font-bold uppercase tracking-widest text-white">Export PDF</span>
                        </button>
                        <button class="flex flex-col items-center justify-center p-5 rounded-[24px] bg-oxid-surface border border-oxid-border gap-3 hover:border-rose-500/30 transition-all active:scale-[0.98] group text-rose-400">
                            <i class="fa-solid fa-trash-can text-xl group-hover:scale-110 transition-transform"></i>
                            <span class="text-[11px] font-bold uppercase tracking-widest">Delete Doc</span>
                        </button>
                    </div>
                </section>
            </div>
        </main>

        <!-- Present Button (Floating Handoff) -->
        <div class="absolute bottom-8 left-0 right-0 px-6 z-20">
            <button class="w-full h-16 rounded-[20px] bg-white text-oxid-bg font-bold text-[14px] uppercase tracking-[0.2em] flex items-center justify-center gap-3 shadow-2xl shadow-white/5 active:scale-[0.98] transition-all">
                <i class="fa-solid fa-share-nodes"></i>
                Present Credential
            </button>
        </div>

    </div>
</body>
