<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Activity — Oxid</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&family=Space+Grotesk:wght@700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'oxid-bg': '#07090E',
                        'oxid-surface': '#0F172A',
                        'oxid-border': '#1E293B',
                        'oxid-primary': '#06B6D4',
                        'oxid-highlight': '#38BDF8',
                        'oxid-identity': '#8B5CF6',
                        'oxid-text': '#F8FAFC',
                        'oxid-muted': '#94A3B8',
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        heading: ['Space Grotesk', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-oxid-bg text-oxid-text font-sans overflow-hidden flex justify-center">
    <div class="w-full max-w-[430px] h-[840px] relative flex flex-col">

        <!-- Concept Banner -->
        <div class="bg-oxid-primary/10 border-b border-oxid-primary/20 py-2.5 flex items-center justify-center gap-2 sticky top-0 z-[60] backdrop-blur-md">
            <i class="fa-solid fa-wand-magic-sparkles text-oxid-primary text-[10px]"></i>
            <span class="text-[9px] font-bold uppercase tracking-[0.2em] text-oxid-primary">Activity Concept — Populated Review</span>
        </div>

        <!-- Header -->
        <header class="px-6 pt-8 pb-4 flex items-center justify-between">
            <h1 class="text-2xl font-heading font-bold text-white tracking-tight">Activity</h1>
            <div class="flex gap-2">
                <button class="w-11 h-11 rounded-xl bg-oxid-surface border border-oxid-border flex items-center justify-center text-oxid-muted hover:text-white transition-colors">
                    <i class="fa-solid fa-filter text-sm"></i>
                </button>
            </div>
        </header>

        <main class="flex-1 px-6 pb-32 overflow-y-auto space-y-6 pt-4">
            
            <!-- Truthful Disclosure -->
            <div class="p-5 bg-oxid-surface rounded-[24px] border border-oxid-border flex gap-4 shadow-xl">
                <i class="fa-solid fa-circle-info text-oxid-primary text-lg mt-0.5"></i>
                <p class="text-[11px] text-oxid-muted leading-relaxed font-medium">
                    This is an <span class="text-white font-bold italic">illustrative sample</span>. Real activity is stored locally or retrieved from a connected Midnight source.
                </p>
            </div>

            <!-- Group: Today -->
            <section class="space-y-4">
                <h3 class="text-[10px] font-bold text-oxid-muted uppercase tracking-[0.2em] px-1">Today</h3>
                <div class="space-y-3">
                    <!-- Item 1 -->
                    <button class="w-full bg-oxid-surface rounded-[24px] p-5 border border-oxid-border flex items-center gap-4 text-left transition-all active:scale-[0.98] hover:border-oxid-primary/30 group shadow-xl">
                        <div class="w-12 h-12 rounded-xl bg-oxid-bg border border-oxid-border flex items-center justify-center text-oxid-primary">
                            <i class="fa-solid fa-share-nodes text-lg"></i>
                        </div>
                        <div class="flex-grow">
                            <p class="text-[14px] font-bold text-white tracking-tight">Identity Disclosed</p>
                            <p class="text-[11px] text-oxid-muted font-medium mt-0.5">To: Example Verifier</p>
                        </div>
                        <div class="text-right">
                            <p class="text-[12px] font-bold text-white">2:45 PM</p>
                            <p class="text-[9px] font-bold text-emerald-400 uppercase tracking-tighter">Verified</p>
                        </div>
                    </button>

                    <!-- Item 2 -->
                    <button class="w-full bg-oxid-surface rounded-[24px] p-5 border border-oxid-border flex items-center gap-4 text-left transition-all active:scale-[0.98] hover:border-oxid-primary/30 group shadow-xl">
                        <div class="w-12 h-12 rounded-xl bg-oxid-bg border border-oxid-border flex items-center justify-center text-oxid-muted">
                            <i class="fa-solid fa-qrcode text-lg"></i>
                        </div>
                        <div class="flex-grow">
                            <p class="text-[14px] font-bold text-white tracking-tight">QR Payload Scanned</p>
                            <p class="text-[11px] text-oxid-muted font-medium mt-0.5">Type: Credential Offer</p>
                        </div>
                        <div class="text-right">
                            <p class="text-[12px] font-bold text-white">11:12 AM</p>
                            <p class="text-[9px] font-bold text-oxid-muted uppercase tracking-tighter italic">Pending</p>
                        </div>
                    </button>
                </div>
            </section>

            <!-- Group: Yesterday -->
            <section class="space-y-4">
                <h3 class="text-[10px] font-bold text-oxid-muted uppercase tracking-[0.2em] px-1">Yesterday</h3>
                <div class="space-y-3 opacity-60">
                    <button class="w-full bg-oxid-surface rounded-[24px] p-5 border border-oxid-border flex items-center gap-4 text-left shadow-xl grayscale">
                        <div class="w-12 h-12 rounded-xl bg-oxid-bg border border-oxid-border flex items-center justify-center text-oxid-identity">
                            <i class="fa-solid fa-address-card text-lg"></i>
                        </div>
                        <div class="flex-grow">
                            <p class="text-[14px] font-bold text-white tracking-tight">Credential Received</p>
                            <p class="text-[11px] text-oxid-muted font-medium mt-0.5 italic">Example Credential</p>
                        </div>
                        <div class="text-right">
                            <p class="text-[12px] font-bold text-white">Oct 24</p>
                        </div>
                    </button>
                </div>
            </section>

        </main>

        <!-- Navigation Bar -->
        <nav id="nav" aria-label="Primary navigation" style="position:fixed;bottom:0;left:0;right:0;z-index:50;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;background:#07090E;border-top:1px solid #1E293B;padding:7px 6px calc(7px + env(safe-area-inset-bottom));box-shadow:0 -8px 28px rgba(0,0,0,.25)">
<button type="button" aria-label="Home" style="min-height:56px;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;background:transparent;color:#94A3B8;font:600 11px/1.1 system-ui,sans-serif;cursor:pointer"><span style="width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:6px;background:transparent;color:inherit"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span><span>Home</span></button>
<button type="button" aria-label="Wallet" style="min-height:56px;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;background:transparent;color:#94A3B8;font:600 11px/1.1 system-ui,sans-serif;cursor:pointer"><span style="width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:6px;background:transparent;color:inherit"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/></svg></span><span>Wallet</span></button>
<button type="button" aria-label="Scan" style="min-height:56px;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;background:transparent;color:#94A3B8;font:600 11px/1.1 system-ui,sans-serif;cursor:pointer"><span style="width:42px;height:42px;display:flex;align-items:center;justify-content:center;border-radius:14px;background:linear-gradient(135deg,#38BDF8,#06B6D4);color:#07131d"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 12h10"/></svg></span><span>Scan</span></button>
<button type="button" aria-label="Documents" style="min-height:56px;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;background:transparent;color:#94A3B8;font:600 11px/1.1 system-ui,sans-serif;cursor:pointer"><span style="width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:6px;background:transparent;color:inherit"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.85 8.62a4 4 0 0 1 4.78-4.77 4 4 0 0 1 6.74 0 4 4 0 0 1 4.78 4.78 4 4 0 0 1 0 6.74 4 4 0 0 1-4.77 4.78 4 4 0 0 1-6.75 0 4 4 0 0 1 0-6.76Z"/><path d="m9 12 2 2 4-4"/></svg></span><span>Documents</span></button>
<button type="button" aria-label="Activity" aria-current="page" style="min-height:56px;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;background:transparent;color:#06B6D4;font:600 11px/1.1 system-ui,sans-serif;cursor:pointer"><span style="width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:6px;background:transparent;color:inherit"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.5.5 0 0 1-.96 0L9.24 2.18a.5.5 0 0 0-.96 0l-2.35 8.36A2 2 0 0 1 4 12H2"/></svg></span><span>Activity</span><span aria-hidden="true" style="width:16px;height:2px;border-radius:2px;background:#06B6D4"></span></button>
</nav>

    </div>
</body>
</html>
