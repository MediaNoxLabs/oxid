<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Send — Oxid</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&family=Space+Grotesk:wght@700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'oxid-bg': '#07090E',
                        'oxid-surface': '#0F172A',
                        'oxid-border': '#1E293B',
                        'oxid-primary': '#06B6D4',
                        'oxid-highlight': '#38BDF8',
                        'oxid-identity': '#8B5CF6',
                        'oxid-text': '#F8FAFC',
                        'oxid-muted': '#94A3B8',
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        heading: ['Space Grotesk', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>
<style>html,body{background:#07090E;color:#F8FAFC}body{margin:0}</style>
</head>
<body class="bg-oxid-bg text-oxid-text font-sans overflow-hidden flex justify-center">
    <div class="w-full max-w-[430px] h-[840px] relative flex flex-col">

        <!-- Header -->
        <header class="px-6 pt-12 pb-4 flex items-center">
            <button class="w-10 h-10 rounded-xl bg-oxid-surface border border-oxid-border flex items-center justify-center text-oxid-muted hover:text-white transition-colors mr-4">
                <i class="fa-solid fa-chevron-left text-sm"></i>
            </button>
            <h1 class="text-xl font-heading font-bold text-white tracking-tight">Send Assets</h1>
        </header>

        <main class="flex-1 px-6 pt-2 pb-28 space-y-7 overflow-y-auto">

            <!-- Source Selection (Blocked Example) -->
            <section class="space-y-3">
                <div class="flex items-center justify-between">
                    <label class="text-[11px] font-bold text-oxid-muted uppercase tracking-widest">From Account</label>
                    <span class="text-[9px] text-rose-400 font-bold bg-rose-400/10 px-2 py-0.5 rounded border border-rose-400/20 uppercase tracking-tighter">No Balance</span>
                </div>
                <button class="w-full p-4 rounded-[20px] bg-oxid-surface border border-rose-500/30 flex items-center justify-between group grayscale cursor-not-allowed">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-xl bg-oxid-bg border border-oxid-border flex items-center justify-center text-oxid-muted">
                            <i class="fa-solid fa-wallet text-lg"></i>
                        </div>
                        <div class="text-left">
                            <p class="font-bold text-[14px] text-white tracking-tight">Primary Private Account</p>
                            <p class="text-[10px] font-bold text-oxid-muted uppercase tracking-tighter">Balance unavailable</p>
                        </div>
                    </div>
                    <i class="fa-solid fa-chevron-down text-oxid-muted text-xs"></i>
                </button>
                <p class="text-[10px] text-rose-400/80 font-bold uppercase tracking-tighter leading-snug px-1">
                    * Transfers are disabled. Connect a funded account to send assets.
                </p>
            </section>

            <!-- Recipient Entry -->
            <section class="space-y-4">
                <div class="flex items-center justify-between">
                    <label class="text-[11px] font-bold text-oxid-muted uppercase tracking-widest">To Recipient</label>
                    <button class="text-[10px] font-bold text-oxid-primary uppercase tracking-widest hover:text-oxid-highlight transition-colors">Scan QR</button>
                </div>

                <div class="relative">
                    <input type="text" placeholder="Enter name or mid_ address"
                           class="w-full bg-oxid-surface border border-oxid-border rounded-2xl p-4 text-sm font-medium focus:outline-none focus:border-oxid-primary/50 transition-colors pr-12 text-white"
                           value="mid_p1sample88...">
                    <div class="absolute right-4 top-1/2 -translate-y-1/2 text-emerald-400 opacity-60">
                        <i class="fa-solid fa-circle-check text-xl"></i>
                    </div>
                </div>

                <div class="bg-emerald-500/5 border border-emerald-500/10 rounded-2xl p-4 flex items-start gap-3">
                    <i class="fa-solid fa-circle-info text-emerald-400 text-xs mt-1"></i>
                    <p class="text-[11px] text-emerald-400/90 font-bold uppercase tracking-tighter leading-relaxed">
                        Recipient verification is unavailable in standalone mode.
                    </p>
                </div>
            </section>

            <!-- Network Selection -->
            <section class="space-y-3">
                <label class="text-[11px] font-bold text-oxid-muted uppercase tracking-widest">Network</label>
                <div class="flex items-center gap-3 p-4 rounded-2xl bg-oxid-surface border border-oxid-border opacity-50">
                    <div class="w-8 h-8 rounded-lg bg-oxid-bg border border-oxid-border flex items-center justify-center text-oxid-muted">
                        <i class="fa-solid fa-circle-nodes"></i>
                    </div>
                    <div>
                        <p class="text-[13px] font-bold text-white tracking-tight">Network unavailable</p>
                        <p class="text-[10px] font-bold text-oxid-muted uppercase tracking-tighter">No live source</p>
                    </div>
                </div>
            </section>

            <!-- Action -->
            <div class="pt-4">
                <button disabled class="w-full py-5 rounded-[20px] bg-oxid-surface border border-oxid-border text-oxid-muted font-bold tracking-widest uppercase text-[14px] cursor-not-allowed opacity-50">
                    Continue
                </button>
                <p class="text-center text-[10px] font-bold text-oxid-muted uppercase tracking-widest mt-6">
                    Insufficient funds for network fees.
                </p>
            </div>

        </main>

        <!-- Navigation Bar -->
        <nav id="nav" aria-label="Primary navigation" style="position:fixed;bottom:0;left:0;right:0;z-index:50;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;background:#07090E;border-top:1px solid #1E293B;padding:7px 6px calc(7px + env(safe-area-inset-bottom));box-shadow:0 -8px 28px rgba(0,0,0,.25)">
<button type="button" aria-label="Home" style="min-height:56px;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;background:transparent;color:#94A3B8;font:600 11px/1.1 system-ui,sans-serif;cursor:pointer"><span style="width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:6px;background:transparent;color:inherit"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span><span>Home</span></button>
<button type="button" aria-label="Wallet" aria-current="page" style="min-height:56px;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;background:transparent;color:#06B6D4;font:600 11px/1.1 system-ui,sans-serif;cursor:pointer"><span style="width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:6px;background:transparent;color:inherit"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/></svg></span><span>Wallet</span><span aria-hidden="true" style="width:16px;height:2px;border-radius:2px;background:#06B6D4"></span></button>
<button type="button" aria-label="Scan" style="min-height:56px;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;background:transparent;color:#94A3B8;font:600 11px/1.1 system-ui,sans-serif;cursor:pointer"><span style="width:42px;height:42px;display:flex;align-items:center;justify-content:center;border-radius:14px;background:linear-gradient(135deg,#38BDF8,#06B6D4);color:#07131d"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 12h10"/></svg></span><span>Scan</span></button>
<button type="button" aria-label="Documents" style="min-height:56px;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;background:transparent;color:#94A3B8;font:600 11px/1.1 system-ui,sans-serif;cursor:pointer"><span style="width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:6px;background:transparent;color:inherit"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.85 8.62a4 4 0 0 1 4.78-4.77 4 4 0 0 1 6.74 0 4 4 0 0 1 4.78 4.78 4 4 0 0 1 0 6.74 4 4 0 0 1-4.77 4.78 4 4 0 0 1-6.75 0 4 4 0 0 1 0-6.76Z"/><path d="m9 12 2 2 4-4"/></svg></span><span>Documents</span></button>
<button type="button" aria-label="Activity" style="min-height:56px;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;background:transparent;color:#94A3B8;font:600 11px/1.1 system-ui,sans-serif;cursor:pointer"><span style="width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:6px;background:transparent;color:inherit"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.5.5 0 0 1-.96 0L9.24 2.18a.5.5 0 0 0-.96 0l-2.35 8.36A2 2 0 0 1 4 12H2"/></svg></span><span>Activity</span></button>
</nav>

    </div>
</body>
</html>
