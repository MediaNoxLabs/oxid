<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Home — Oxid</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&family=Space+Grotesk:wght@700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'oxid-bg': '#07090E',
                        'oxid-surface': '#0F172A',
                        'oxid-border': '#1E293B',
                        'oxid-primary': '#06B6D4',
                        'oxid-highlight': '#38BDF8',
                        'oxid-identity': '#8B5CF6',
                        'oxid-text': '#F8FAFC',
                        'oxid-muted': '#94A3B8',
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        heading: ['Space Grotesk', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-oxid-bg text-oxid-text font-sans overflow-hidden flex justify-center">
    <div class="w-full max-w-[430px] h-[840px] relative flex flex-col">

        <!-- Concept Banner -->
        <div class="bg-oxid-primary/10 border-b border-oxid-primary/20 py-2.5 flex items-center justify-center gap-2 sticky top-0 z-[60] backdrop-blur-md">
            <i class="fa-solid fa-wand-magic-sparkles text-oxid-primary text-[10px]"></i>
            <span class="text-[9px] font-bold uppercase tracking-[0.2em] text-oxid-primary">Home Concept — Populated Review</span>
        </div>

        <!-- Header -->
        <header class="px-6 pt-8 pb-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-oxid-surface border border-oxid-border flex items-center justify-center text-oxid-primary font-heading font-bold shadow-xl">
                    <img src="https://storage.googleapis.com/uxpilot-auth.appspot.com/mcp-canvas-assets/sbo9HjaII9WGCx7j4TzA5Z7aWnH2/r30d8UxUa7xuLus8ZH2j/1790500071694-eccfe7a6-4733-425a-817f-a47b5ab3bb98-New-brand-reference-OXID-Lunar-Aegis-master-vector.svg" alt="OXID Lunar Aegis" style="width:34px;height:34px;border-radius:9px;object-fit:cover" />
                </div>
                <h1 class="text-xl font-heading font-bold text-white tracking-tight">Lunar Aegis</h1>
            </div>
            <button class="w-11 h-11 rounded-xl bg-oxid-surface border border-oxid-border flex items-center justify-center text-oxid-muted hover:text-white transition-colors shadow-xl">
                <i class="fa-solid fa-gear text-sm"></i>
            </button>
        </header>

        <main class="flex-1 px-6 pb-32 overflow-y-auto space-y-9 pt-4">
            
            <!-- Assets Concept -->
            <section id="assets-summary" class="space-y-4">
                <div class="flex items-center justify-between px-1">
                    <h2 class="text-[10px] font-bold text-oxid-muted uppercase tracking-[0.2em]">Asset Overview</h2>
                    <span class="text-[9px] font-bold text-oxid-primary uppercase tracking-tighter italic">Illustrative</span>
                </div>
                <div class="bg-gradient-to-br from-oxid-surface to-oxid-bg rounded-[32px] p-8 border border-oxid-border shadow-2xl relative overflow-hidden group">
                    <div class="absolute -top-12 -right-12 w-48 h-48 bg-oxid-primary/5 rounded-full blur-3xl group-hover:bg-oxid-primary/10 transition-colors"></div>
                    <div class="relative z-10 space-y-6">
                        <div class="space-y-1">
                            <p class="text-[10px] font-bold text-oxid-muted uppercase tracking-widest">Total Estimated Value</p>
                            <div class="flex items-baseline gap-3">
                                <h3 class="text-4xl font-heading font-bold text-white tracking-tight">1,240.50</h3>
                                <span class="text-lg text-oxid-primary font-bold uppercase tracking-widest">DUST</span>
                            </div>
                        </div>
                        <div class="flex gap-4">
                            <button class="flex-1 h-12 rounded-xl bg-white text-oxid-bg font-bold text-[12px] uppercase tracking-widest shadow-xl active:scale-[0.98] transition-all">Send</button>
                            <button class="flex-1 h-12 rounded-xl bg-oxid-surface border border-oxid-border text-white font-bold text-[12px] uppercase tracking-widest shadow-xl active:scale-[0.98] transition-all">Receive</button>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Identity Concept -->
            <section id="identity-summary" class="space-y-4">
                <div class="flex items-center justify-between px-1">
                    <h2 class="text-[10px] font-bold text-oxid-muted uppercase tracking-[0.2em]">Identity Portfolio</h2>
                    <span class="text-[9px] font-bold text-oxid-identity uppercase tracking-tighter italic">Simulated</span>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-oxid-surface rounded-[24px] p-5 border border-oxid-border shadow-xl space-y-4">
                        <div class="w-10 h-10 rounded-xl bg-oxid-identity/10 border border-oxid-identity/20 flex items-center justify-center text-oxid-identity">
                            <i class="fa-solid fa-address-card text-lg"></i>
                        </div>
                        <div>
                            <p class="text-[13px] font-bold text-white tracking-tight">Credentials</p>
                            <p class="text-[11px] text-oxid-muted font-medium mt-0.5">3 Active Docs</p>
                        </div>
                    </div>
                    <div class="bg-oxid-surface rounded-[24px] p-5 border border-oxid-border shadow-xl space-y-4">
                        <div class="w-10 h-10 rounded-xl bg-oxid-highlight/10 border border-oxid-highlight/20 flex items-center justify-center text-oxid-highlight">
                            <i class="fa-solid fa-shield-halved text-lg"></i>
                        </div>
                        <div>
                            <p class="text-[13px] font-bold text-white tracking-tight">Security</p>
                            <p class="text-[11px] text-oxid-muted font-medium mt-0.5">Shield Active</p>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Recent Concept -->
            <section id="recent-activity" class="space-y-4">
                <h2 class="text-[10px] font-bold text-oxid-muted uppercase tracking-[0.2em] px-1">Recent Local Events</h2>
                <div class="bg-oxid-surface rounded-[24px] border border-oxid-border overflow-hidden shadow-xl">
                    <div class="p-5 border-b border-oxid-border/50 flex items-center justify-between">
                        <div class="flex items-center gap-4">
                            <div class="w-10 h-10 rounded-xl bg-oxid-bg border border-oxid-border flex items-center justify-center text-oxid-muted">
                                <i class="fa-solid fa-arrow-up text-sm"></i>
                            </div>
                            <div>
                                <p class="text-[13px] font-bold text-white tracking-tight">Sent Payment</p>
                                <p class="text-[10px] text-oxid-muted font-medium mt-0.5">Today, 2:45 PM</p>
                            </div>
                        </div>
                        <span class="text-[13px] font-bold text-white">-10.00 <span class="text-[10px] text-oxid-muted">DUST</span></span>
                    </div>
                </div>
                <button class="w-full py-4 text-[11px] font-bold text-oxid-primary uppercase tracking-widest hover:text-oxid-highlight transition-colors">View All Activity</button>
            </section>

        </main>

        <!-- Navigation Bar -->
        <nav id="nav" aria-label="Primary navigation" style="position:fixed;bottom:0;left:0;right:0;z-index:50;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;background:#07090E;border-top:1px solid #1E293B;padding:7px 6px calc(7px + env(safe-area-inset-bottom));box-shadow:0 -8px 28px rgba(0,0,0,.25)">
<button type="button" aria-label="Home" aria-current="page" style="min-height:56px;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;background:transparent;color:#06B6D4;font:600 11px/1.1 system-ui,sans-serif;cursor:pointer"><span style="width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:6px;background:transparent;color:inherit"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span><span>Home</span><span aria-hidden="true" style="width:16px;height:2px;border-radius:2px;background:#06B6D4"></span></button>
<button type="button" aria-label="Wallet" style="min-height:56px;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;background:transparent;color:#94A3B8;font:600 11px/1.1 system-ui,sans-serif;cursor:pointer"><span style="width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:6px;background:transparent;color:inherit"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/></svg></span><span>Wallet</span></button>
<button type="button" aria-label="Scan" style="min-height:56px;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;background:transparent;color:#94A3B8;font:600 11px/1.1 system-ui,sans-serif;cursor:pointer"><span style="width:42px;height:42px;display:flex;align-items:center;justify-content:center;border-radius:14px;background:linear-gradient(135deg,#38BDF8,#06B6D4);color:#07131d"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 12h10"/></svg></span><span>Scan</span></button>
<button type="button" aria-label="Documents" style="min-height:56px;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;background:transparent;color:#94A3B8;font:600 11px/1.1 system-ui,sans-serif;cursor:pointer"><span style="width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:6px;background:transparent;color:inherit"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.85 8.62a4 4 0 0 1 4.78-4.77 4 4 0 0 1 6.74 0 4 4 0 0 1 4.78 4.78 4 4 0 0 1 0 6.74 4 4 0 0 1-4.77 4.78 4 4 0 0 1-6.75 0 4 4 0 0 1 0-6.76Z"/><path d="m9 12 2 2 4-4"/></svg></span><span>Documents</span></button>
<button type="button" aria-label="Activity" style="min-height:56px;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;background:transparent;color:#94A3B8;font:600 11px/1.1 system-ui,sans-serif;cursor:pointer"><span style="width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:6px;background:transparent;color:inherit"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.5.5 0 0 1-.96 0L9.24 2.18a.5.5 0 0 0-.96 0l-2.35 8.36A2 2 0 0 1 4 12H2"/></svg></span><span>Activity</span></button>
</nav>

    </div>
</body>
</html>
