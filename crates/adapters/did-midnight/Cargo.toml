[package]
name = "oxid-adapter-did-midnight"
description = "Midnight DID resolver adapters for Oxid"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = []
# Explicit Android Tailnet-demo egress for one public holder DID document.
# Normal resolver and lifecycle builds do not contain this capability.
tailnet-test-did-publication = []

[dependencies]
base64.workspace = true
blake2.workspace = true
futures.workspace = true
hex.workspace = true
midnight-base-crypto.workspace = true
midnight-ledger.workspace = true
midnight-onchain-state.workspace = true
midnight-serialize.workspace = true
midnight-storage.workspace = true
midnight-transient-crypto.workspace = true
oxid-foundation.workspace = true
oxid-identity-application.workspace = true
oxid-identity-domain.workspace = true
oxid-adapter-platform-system.workspace = true
oxid-wallet-application.workspace = true
oxid-wallet-domain.workspace = true
p256.workspace = true
rand.workspace = true
reqwest = { workspace = true, features = ["stream"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
zeroize.workspace = true

[lints]
workspace = true

[dev-dependencies]
oxid-adapter-platform-system.workspace = true
oxid-adapter-storage-dev.workspace = true
