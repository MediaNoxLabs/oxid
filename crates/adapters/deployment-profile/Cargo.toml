[package]
name = "oxid-adapter-deployment-profile"
description = "Authenticated build-time deployment profiles for Oxid composition"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = []
readiness = [
  "dep:futures",
  "dep:oxid-capabilities-application",
  "dep:reqwest",
  "dep:rustls",
  "dep:tokio",
  "dep:tokio-tungstenite",
]

[dependencies]
base64.workspace = true
ed25519-dalek.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
url.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
futures = { workspace = true, optional = true }
oxid-capabilities-application = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true }

[lints]
workspace = true
