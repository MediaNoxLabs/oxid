[package]
name = "oxid-adapter-vc-midnight"
description = "Strict Midnight CBOR credential verification and standalone ingress adapter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = []
# Embeds the exact authenticated runtime-minimal presentation artifact set in
# an opt-in mobile measurement build. Normal application graphs never select
# this feature.
mobile-compact-artifacts = []

[dependencies]
base64.workspace = true
ciborium.workspace = true
ed25519-dalek.workspace = true
hex.workspace = true
midnight-base-crypto.workspace = true
midnight-serialize.workspace = true
midnight-transient-crypto.workspace = true
oxid-credential-application.workspace = true
oxid-credential-domain.workspace = true
oxid-foundation.workspace = true
oxid-platform-ports.workspace = true
oxid-identity-application.workspace = true
oxid-identity-domain.workspace = true
oxid-presentation-application.workspace = true
oxid-presentation-domain.workspace = true
p256.workspace = true
sha2.workspace = true
serde.workspace = true
serde_arrays.workspace = true
serde_json.workspace = true
zeroize.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
futures.workspace = true
midnight-zkir.workspace = true
rand.workspace = true

[dev-dependencies]
getrandom.workspace = true

[lints]
workspace = true
