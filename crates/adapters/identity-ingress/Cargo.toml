[package]
name = "oxid-adapter-identity-ingress"
description = "Strict protocol-link routing and native QR ingress for Oxid"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = []
# Test-only, non-secret OS trigger for the standalone-portal mobile suite
# (issue #124 / ADR-0103). `simctl openurl`/`am start -d` deliver a fixed
# literal string, never the real Portal offer, so the pre-authorized grant
# never appears in host process argv or in any retained test log/evidence.
# A fresh app-private capability authenticates one named, bounded loopback
# worker; the file is unlinked before use and the server permits one response.
# The fetched offer then enters the same one-item router as normal ingress.
# Selected only by `oxid-composition`'s
# authority-guarded `mobile-portal` feature, forwarded from the iOS/Android
# `oxid-app/standalone-portal` profile.
loopback-test-offer-trigger = []

[dependencies]
oxid-adapter-mobile-native.workspace = true
oxid-platform-ports.workspace = true
oxid-protocol-application.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
url.workspace = true
zeroize.workspace = true

[lints]
workspace = true
