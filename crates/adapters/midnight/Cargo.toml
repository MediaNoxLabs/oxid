[package]
name = "oxid-adapter-midnight"
description = "Midnight network, address, and account read-model adapters for Oxid"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = []
proving-bench = []

[[example]]
name = "local-proving"
required-features = ["proving-bench"]

[dependencies]
bech32.workspace = true
hex.workspace = true
oxid-foundation.workspace = true
oxid-platform-ports.workspace = true
oxid-wallet-application.workspace = true
oxid-wallet-domain.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
anyhow.workspace = true
futures.workspace = true
midnight-base-crypto.workspace = true
midnight-coin-structure.workspace = true
midnight-ledger = { workspace = true, features = ["proving"] }
midnight-onchain-runtime.workspace = true
midnight-serialize.workspace = true
midnight-storage.workspace = true
midnight-transient-crypto.workspace = true
midnight-zkir.workspace = true
midnight-zswap.workspace = true
rand.workspace = true
reqwest = { workspace = true, features = ["stream"] }
rustls.workspace = true
subxt.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
zeroize.workspace = true

[lints]
workspace = true
