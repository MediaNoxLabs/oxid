[package]
name = "oxid-ui-dioxus"
description = "Dioxus incoming UI adapter for Oxid"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
mobile = ["dioxus/mobile"]
# Asserts a deliberate, reviewed non-user profile selection. oxid-app's guarded
# features forward it; adapter-only profile builds state it explicitly.
# src/profile_guard.rs rejects a profile without it, so an application build
# cannot pick one up through the dependency path and skip the guards.
app-profile-authority = []
ui-profile-dev = ["dep:oxid-capabilities-application"]
ui-profile-demo = []
# Bounded developer-only mobile/desktop proof benchmark presentation.
proof-benchmark = ["ui-profile-dev"]
# Read-only projection of an app-selected standalone route profile. This
# feature has no endpoint input and cannot change composition.
standalone-deployment-profile = ["dep:oxid-capabilities-application"]
# Visible safety marker for the shared, publicly spendable standalone genesis
# wallet. This feature carries presentation only; composition owns authority.
public-standalone-genesis = []
# Owner-entered root recovery UI. Normal desktop/web/mobile artifacts do not
# compile its controls or copy.
preprod-observation = []
# Strictly test-only in-process driver for environments where WKWebView does
# not expose rendered controls through macOS Accessibility.
desktop-test-click-driver = ["dep:dioxus-document"]

[dependencies]
dioxus = { workspace = true, features = ["minimal"] }
dioxus-document = { workspace = true, optional = true }
oxid-capabilities-application = { workspace = true, optional = true }
oxid-wallet-application.workspace = true
oxid-credential-application.workspace = true
oxid-diagnostics-application.workspace = true
oxid-identity-application.workspace = true
oxid-identity-domain.workspace = true
oxid-protocol-application.workspace = true
oxid-presentation-application.workspace = true
oxid-passport-vault-application.workspace = true
oxid-platform-ports.workspace = true
qrcode.workspace = true
tokio.workspace = true
zeroize.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
futures.workspace = true

[lints]
workspace = true
