[package]
name = "oxid-ui-dioxus"
description = "Dioxus incoming UI adapter for Oxid"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
mobile = ["dioxus/mobile"]
ui-profile-dev = ["dep:oxid-capabilities-application"]

[dependencies]
dioxus = { workspace = true, features = ["minimal"] }
oxid-capabilities-application = { workspace = true, optional = true }
oxid-wallet-application.workspace = true
oxid-credential-application.workspace = true
oxid-diagnostics-application.workspace = true
oxid-identity-application.workspace = true
oxid-identity-domain.workspace = true
oxid-protocol-application.workspace = true
oxid-presentation-application.workspace = true
oxid-passport-vault-application.workspace = true
oxid-platform-ports.workspace = true
qrcode.workspace = true
tokio.workspace = true
zeroize.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
futures.workspace = true

[lints]
workspace = true
