[package]
name = "oxid-composition"
description = "Static composition root for Oxid application capabilities"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = []
mobile-compact-artifacts = ["oxid-adapter-vc-midnight/mobile-compact-artifacts"]
# Native-mobile Portal identity/HTTP capability. It is target-gated, and its
# fixed trigger remains runtime-inert until the app-owned standalone-portal path
# calls the explicit Portal composition constructor.
mobile-portal = [
  "dep:oxid-adapter-mobile-native",
  "oxid-adapter-openid4vci/portal-http-mobile",
  "oxid-adapter-identity-ingress/loopback-test-offer-trigger",
]
mobile-portal-tailnet = [
  "mobile-portal",
  "oxid-adapter-identity-ingress/tailnet-test-offer-trigger",
]
android-jni-exception-recovery-test = [
  "dep:oxid-adapter-mobile-native",
  "oxid-adapter-mobile-native/android-jni-exception-recovery-test",
]

[dependencies]
oxid-adapter-backup-complete.workspace = true
oxid-adapter-backup-portable.workspace = true
oxid-adapter-did-midnight.workspace = true
oxid-adapter-backup-document-mobile.workspace = true
oxid-adapter-diagnostics-memory.workspace = true
oxid-adapter-deployment-profile.workspace = true
oxid-adapter-identity-ingress.workspace = true
oxid-adapter-storage-credential-json.workspace = true
oxid-adapter-midnight.workspace = true
oxid-adapter-mobile-native = { workspace = true, optional = true }
oxid-adapter-openid4vci.workspace = true
oxid-adapter-openid4vp.workspace = true
oxid-adapter-passport-vault.workspace = true
oxid-adapter-siopv2.workspace = true
oxid-adapter-platform-system.workspace = true
oxid-adapter-storage-json.workspace = true
oxid-adapter-storage-memory.workspace = true
oxid-adapter-storage-mobile.workspace = true
oxid-adapter-storage-dev.workspace = true
oxid-adapter-storage-identity-json.workspace = true
oxid-adapter-vc-midnight.workspace = true
oxid-credential-application.workspace = true
oxid-diagnostics-application.workspace = true
oxid-identity-application.workspace = true
oxid-presentation-application.workspace = true
oxid-passport-vault-application.workspace = true
oxid-platform-ports.workspace = true
oxid-protocol-application.workspace = true
oxid-wallet-application.workspace = true

[dev-dependencies]
futures.workspace = true
hex.workspace = true
midnight-base-crypto.workspace = true
midnight-ledger.workspace = true
midnight-onchain-runtime.workspace = true
midnight-serialize.workspace = true
midnight-storage.workspace = true
midnight-zswap.workspace = true
sha2.workspace = true
tokio.workspace = true
zeroize.workspace = true

[lints]
workspace = true
